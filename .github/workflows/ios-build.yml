# Compiles the iOS app (no signing) and runs the PlanBuilder unit tests on a
# simulator. Its job is to put a real Swift compiler over code that was written
# without one. It also packages an unsigned .ipa that can be installed on a
# real iPhone with a sideloading tool (signed with the owner's Apple ID).
name: iOS build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    # macos-26 ships Xcode 26.x (Xcode 27 is a separate "xcode-27" image).
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Placeholder editor if web/editor.html is not committed yet
        run: |
          if [ ! -f web/editor.html ]; then
            echo "::warning::web/editor.html missing - building with a placeholder (Plan tab will be blank)."
            mkdir -p web
            echo '<!doctype html><title>placeholder</title><p>editor.html placeholder (CI)</p>' > web/editor.html
          fi

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build app for device (unsigned)
        id: devbuild
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project SecureScan.xcodeproj \
            -scheme SecureScan \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

      - name: Package the app for installing (.ipa, unsigned)
        # An unsigned .ipa for a real iPhone. It is signed at install time with the
        # owner's own Apple ID by a sideloading tool on a PC or Mac (see README).
        # Release build when it compiles; otherwise the Debug build from above.
        id: ipa
        if: steps.devbuild.outcome == 'success'
        working-directory: ios
        run: |
          set -x
          APP=""
          if xcodebuild build -project SecureScan.xcodeproj -scheme SecureScan -configuration Release \
               -destination 'generic/platform=iOS' -derivedDataPath ddrel CODE_SIGNING_ALLOWED=NO > release.log 2>&1; then
            APP=ddrel/Build/Products/Release-iphoneos/SecureScan.app
          else
            echo "::warning::Release build failed - packaging the Debug build instead"
            grep -E "error:" release.log | sort -u | head -40 || true
            xcodebuild build -project SecureScan.xcodeproj -scheme SecureScan -configuration Debug \
              -destination 'generic/platform=iOS' -derivedDataPath dddbg CODE_SIGNING_ALLOWED=NO > debugipa.log 2>&1
            APP=dddbg/Build/Products/Debug-iphoneos/SecureScan.app
          fi
          test -d "$APP"
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../SecureScan.ipa Payload)
          ls -la SecureScan.ipa
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" -c "Print :MinimumOSVersion" "$APP/Info.plist" || true

      - name: Upload the .ipa to this run
        if: steps.ipa.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SecureScan-ipa
          path: ios/SecureScan.ipa

      - name: Publish the .ipa as a download
        # One fixed link per branch: releases/download/build-<branch>/SecureScan.ipa
        if: steps.ipa.outcome == 'success' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_REF_NAME//\//-}"
          NOTES="Unsigned build of ${GITHUB_REF_NAME} at ${GITHUB_SHA::7} ($(date -u '+%Y-%m-%d %H:%M UTC')). Install with a sideloading tool - see README."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ios/SecureScan.ipa --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" ios/SecureScan.ipa --title "SecureScan ($GITHUB_REF_NAME)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi

      - name: Run unit tests on a simulator
        # Runs even if the app build failed: the maths tests compile on their own.
        if: success() || failure()
        working-directory: ios
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          d = json.load(sys.stdin)["devices"]
          def ver(rt):
              m = re.search(r"iOS-(\d+)-(\d+)", rt)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          best = [dev["udid"] for rt in sorted(d, key=ver) if "iOS" in rt for dev in d[rt] if dev["name"].startswith("iPhone")]
          print(best[-1] if best else "")')
          echo "Simulator: $UDID"
          test -n "$UDID"
          xcodebuild test \
            -project SecureScan.xcodeproj \
            -scheme SecureScan \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log

      - name: Run the app on a simulator and take screenshots
        # The simulator has no LiDAR, so this exercises everything after the
        # scan: demo job -> real plan converter -> editor in the web view, 3D, files.
        if: success()
        continue-on-error: true
        working-directory: ios
        run: |
          set -x
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          d = json.load(sys.stdin)["devices"]
          def ver(rt):
              m = re.search(r"iOS-(\d+)-(\d+)", rt)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          best = [dev["udid"] for rt in sorted(d, key=ver) if "iOS" in rt for dev in d[rt] if dev["name"].startswith("iPhone")]
          print(best[-1] if best else "")')
          xcodebuild build -project SecureScan.xcodeproj -scheme SecureScan -configuration Debug \
            -destination "id=$UDID" -derivedDataPath dd CODE_SIGNING_ALLOWED=NO > simbuild.log 2>&1 || { tail -60 simbuild.log; exit 1; }
          APP=dd/Build/Products/Debug-iphonesimulator/SecureScan.app
          BID=com.secureworkswa.securescan
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # Fresh install: removes any job (and demo data) left by an older build.
          xcrun simctl uninstall "$UDID" "$BID" || true
          xcrun simctl install "$UDID" "$APP"
          OUT=../ci-screenshots
          rm -rf "$OUT" && mkdir -p "$OUT"
          shot() { sleep "$2"; xcrun simctl io "$UDID" screenshot "$OUT/$1.png"; xcrun simctl terminate "$UDID" "$BID" || true; sleep 2; }
          # UX2 Studio: the real capture HUD + overlay over a synthetic room, one scene per launch.
          for SCENE in aim-wall aim-wall-bright aim-skirting aim-nothing reading-tray reading-saved line-progress line-tray-skirting \
                       lining-band-done area-progress area-tray photo-taken review-drawer equipment-place equipment-airflow \
                       source-tray room-name-tray scan-coaching visit-remeasure scope-on-site needs-fix; do
            SIMCTL_CHILD_SECURESCAN_STUDIO=$SCENE xcrun simctl launch "$UDID" "$BID"; shot "studio-$SCENE" 6
          done
          # App shell (docs/UX2.md "The rest of the app"). SECURESCAN_LIDAR=1 (Debug builds) shows
          # what a LiDAR iPhone shows; SECURESCAN_SEED=jobs adds demo jobs in four states.
          L="SIMCTL_CHILD_SECURESCAN_LIDAR=1"
          env $L xcrun simctl launch "$UDID" "$BID";                                                            shot app-jobs-empty 10
          env $L SIMCTL_CHILD_SECURESCAN_SEED=jobs xcrun simctl launch "$UDID" "$BID";                          shot app-jobs-list 45
          env $L SIMCTL_CHILD_SECURESCAN_PREVIEW=newjob xcrun simctl launch "$UDID" "$BID";                     shot app-new-job 10
          SIMCTL_CHILD_SECURESCAN_DEMO=1 SIMCTL_CHILD_SECURESCAN_TAB=plan xcrun simctl launch "$UDID" "$BID";   shot app-job-plan 18
          SIMCTL_CHILD_SECURESCAN_DEMO=1 SIMCTL_CHILD_SECURESCAN_TAB=3d xcrun simctl launch "$UDID" "$BID";     shot app-job-3d 16
          SIMCTL_CHILD_SECURESCAN_DEMO=1 SIMCTL_CHILD_SECURESCAN_TAB=items xcrun simctl launch "$UDID" "$BID";  shot app-job-items 14
          SIMCTL_CHILD_SECURESCAN_SEED=jobs SIMCTL_CHILD_SECURESCAN_OPEN_REF=CLM-20417 SIMCTL_CHILD_SECURESCAN_TAB=items xcrun simctl launch "$UDID" "$BID"; shot app-job-items-needs-fix 16
          SIMCTL_CHILD_SECURESCAN_DEMO=1 SIMCTL_CHILD_SECURESCAN_TAB=files xcrun simctl launch "$UDID" "$BID";  shot app-job-files 12
          SIMCTL_CHILD_SECURESCAN_DEMO=1 SIMCTL_CHILD_SECURESCAN_PREVIEW=documents xcrun simctl launch "$UDID" "$BID"; shot app-job-documents-menu 18
          env $L SIMCTL_CHILD_SECURESCAN_PREVIEW=settings xcrun simctl launch "$UDID" "$BID";                   shot app-settings 10
          # A two-visit job: Documents adds the Monitoring report.
          SIMCTL_CHILD_SECURESCAN_SEED=jobs SIMCTL_CHILD_SECURESCAN_OPEN_REF=QBE-7731902 SIMCTL_CHILD_SECURESCAN_PREVIEW=documents xcrun simctl launch "$UDID" "$BID"; shot app-job-documents-menu-visits 20
          # Dynamic Type at XXL for the list screens.
          xcrun simctl ui "$UDID" content_size extra-extra-large || true
          env $L xcrun simctl launch "$UDID" "$BID";                                                            shot app-jobs-list-xl 12
          SIMCTL_CHILD_SECURESCAN_DEMO=1 SIMCTL_CHILD_SECURESCAN_TAB=items xcrun simctl launch "$UDID" "$BID";  shot app-job-items-xl 14
          xcrun simctl ui "$UDID" content_size large || true
          # Same 3D view from the side, square-on to the wall with the moisture line.
          SIMCTL_CHILD_SECURESCAN_DEMO=1 SIMCTL_CHILD_SECURESCAN_TAB=1 SIMCTL_CHILD_SECURESCAN_3D_AZIMUTH=100 xcrun simctl launch "$UDID" "$BID"; shot 06-demo-3d-side 16
          # The hosted editor's other views (switched through its public SecureScan.setView hook).
          SIMCTL_CHILD_SECURESCAN_DEMO=1 SIMCTL_CHILD_SECURESCAN_EDITOR_VIEW=walls xcrun simctl launch "$UDID" "$BID";  shot 07-editor-walls 18
          SIMCTL_CHILD_SECURESCAN_DEMO=1 SIMCTL_CHILD_SECURESCAN_EDITOR_VIEW=notes xcrun simctl launch "$UDID" "$BID";  shot 08-editor-notes 18
          SIMCTL_CHILD_SECURESCAN_DEMO=1 SIMCTL_CHILD_SECURESCAN_EDITOR_VIEW=report xcrun simctl launch "$UDID" "$BID"; shot 09-editor-report 20
          # The Return visit entry (the capture screens themselves are the studio-* shots above).
          SIMCTL_CHILD_SECURESCAN_DEMO=1 SIMCTL_CHILD_SECURESCAN_PREVIEW=revisit xcrun simctl launch "$UDID" "$BID";      shot 13-revisit-entry 14
          # The assessment report PDF, made by the same code as Export, plus report-check.txt.
          SIMCTL_CHILD_SECURESCAN_DEMO=1 SIMCTL_CHILD_SECURESCAN_EXPORT_REPORT=1 xcrun simctl launch "$UDID" "$BID"
          DATA=$(xcrun simctl get_app_container "$UDID" "$BID" data)
          for i in $(seq 1 60); do [ -f "$DATA/Documents/report-check/report-check.txt" ] && break; sleep 3; done
          sleep 2
          xcrun simctl io "$UDID" screenshot "$OUT/10-report-export.png"
          cp "$DATA/Documents/report-check/report-check.txt" "$OUT/report-check.txt" || echo "report-check.txt missing" > "$OUT/report-check.txt"
          cp "$DATA/Documents/report-check/assessment-report.pdf" "$OUT/assessment-report.pdf" || true
          cat "$OUT/report-check.txt"
          xcrun simctl terminate "$UDID" "$BID" || true
          sleep 2
          # The quote and the scope of works through the job screen's document path
          # (SecureScan.reportHTML(kind)). SECURESCAN_PRICES=1 (Debug builds only) stands in
          # for the office PIN so the quote can be made; the scope run keeps prices hidden.
          SIMCTL_CHILD_SECURESCAN_DEMO=1 SIMCTL_CHILD_SECURESCAN_PRICES=1 SIMCTL_CHILD_SECURESCAN_EXPORT_REPORT=quote xcrun simctl launch "$UDID" "$BID"
          for i in $(seq 1 40); do [ -f "$DATA/Documents/report-check-quote/report-check.txt" ] && break; sleep 3; done
          sleep 2
          xcrun simctl io "$UDID" screenshot "$OUT/16-quote-export.png"
          cp "$DATA/Documents/report-check-quote/report-check.txt" "$OUT/report-check-quote.txt" || echo "quote report-check.txt missing" > "$OUT/report-check-quote.txt"
          cp "$DATA/Documents/report-check-quote/quote.pdf" "$OUT/quote.pdf" || true
          cat "$OUT/report-check-quote.txt"
          xcrun simctl terminate "$UDID" "$BID" || true
          sleep 2
          SIMCTL_CHILD_SECURESCAN_DEMO=1 SIMCTL_CHILD_SECURESCAN_PRICES=0 SIMCTL_CHILD_SECURESCAN_EXPORT_REPORT=scope xcrun simctl launch "$UDID" "$BID"
          for i in $(seq 1 40); do [ -f "$DATA/Documents/report-check-scope/report-check.txt" ] && break; sleep 3; done
          sleep 2
          cp "$DATA/Documents/report-check-scope/report-check.txt" "$OUT/report-check-scope.txt" || echo "scope report-check.txt missing" > "$OUT/report-check-scope.txt"
          cp "$DATA/Documents/report-check-scope/scope-of-works.pdf" "$OUT/scope-of-works.pdf" || true
          cat "$OUT/report-check-scope.txt"
          xcrun simctl terminate "$UDID" "$BID" || true
          sleep 2
          # Stress: a separate demo job with ~26 photos (a long report) through the same path.
          SIMCTL_CHILD_SECURESCAN_DEMO=1 SIMCTL_CHILD_SECURESCAN_DEMO_VARIANT=stress SIMCTL_CHILD_SECURESCAN_EXPORT_REPORT=1 xcrun simctl launch "$UDID" "$BID"
          for i in $(seq 1 80); do [ -f "$DATA/Documents/report-check-stress/report-check.txt" ] && break; sleep 3; done
          cp "$DATA/Documents/report-check-stress/report-check.txt" "$OUT/report-check-stress.txt" || echo "stress report-check.txt missing" > "$OUT/report-check-stress.txt"
          cp "$DATA/Documents/report-check-stress/assessment-report.pdf" "$OUT/assessment-report-stress.pdf" || true
          cat "$OUT/report-check-stress.txt"
          xcrun simctl terminate "$UDID" "$BID" || true
          # Any crash reports from the app, for diagnosis.
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i securescan | head -5 > "$OUT/crash-reports.txt" || true
          for f in ~/Library/Logs/DiagnosticReports/SecureScan*; do [ -f "$f" ] && head -c 6000 "$f" > "$OUT/$(basename "$f").txt"; done || true
          ls -la "$OUT"

      - name: Commit the generated Xcode project and screenshots
        # So the owner can download the repo and open ios/SecureScan.xcodeproj
        # directly, without installing XcodeGen.
        if: success() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/SecureScan.xcodeproj ios/SecureScan/Info.plist
          [ -d ci-screenshots ] && git add ci-screenshots
          if git diff --cached --quiet; then
            echo "Xcode project unchanged"
          else
            git commit -m "Generated Xcode project and simulator screenshots [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Summarise compiler errors
        if: failure()
        working-directory: ios
        run: |
          for f in build.log test.log; do
            [ -f "$f" ] || continue
            echo "===== $f: errors ====="
            grep -E "error:|\*\* (BUILD|TEST) FAILED|Test Case .* failed|XCTAssert" "$f" | sort -u | head -80 || true
          done

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            ios/build.log
            ios/test.log
          if-no-files-found: ignore
