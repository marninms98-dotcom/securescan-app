  }

  /* 3. marked-up plan: numbered pins only, each a link (the location master) */
  let houseOnPlan = null;
  {
    const body = page('plan', 'p-plan');
    body.append(frag(`<h1>Marked-up floor plan</h1>`));
    body.append(frag(dm ? `<p class="rp-lede">Pins show visit ${visit.n} readings; the small mark beside a pin compares it with the previous visit. Numbers lead to the drying progress table or the evidence card.</p>` : `<p class="rp-lede">Numbered pins lead to the evidence card or table row for that item.</p>`));
    const lay = { ...ALL_LAYERS, furniture: false };
    const probe = renderPlan(doc, geo, { markup: true, bare: true, layers: lay, pinsOnly: true, refs: model.refs, remRefs });
    const lg = frag(`<div class="rp-keyrow">${keyHTML(probe.legendRows)}${probe.legendNotes.map(n => `<div class="rp-legnote">${esc(n)}</div>`).join('')}</div>`);
    body.append(lg);
    let avail = RP_BODY_H - lg.offsetHeight - 70;
    // the low-wall house cutaway shares the page when both fit well at A4 (a wide, shallow house); else it follows
    if (iso3d) {
      const hp = probe.drawn.h * RP_CW / probe.drawn.w, hc = renderCut(doc, geo, { W: RP_CW }).H, room0 = avail - 26;
      if (hp + hc <= room0 * 1.12) { const k2 = Math.min(1, room0 / (hp + hc)); houseOnPlan = { h: hc * k2 }; avail = room0 - hc * k2; }
    }
    const scale0 = Math.min(RP_CW / probe.drawn.w, avail / probe.drawn.h);
    const pk = clamp(7.5 / (11 * scale0), 0.65, 2.8), lk = clamp(7.5 / (15 * scale0), 0.75, 2.2);
    const pl = renderPlan(doc, geo, { markup: true, bare: true, layers: lay, pinsOnly: true, refs: model.refs, remRefs, equipLabels: false, pk, lk });
    const tagA = pl.hits.filter(h => h.kind === 'removal' && h.poly && remRefs.has(h.id)).map(h => { const b = bboxOf(h.poly); return `<a href="#x-${safeId(h.id)}" class="rp-tagl"><rect x="${f1(b.x0)}" y="${f1(b.y0)}" width="${f1(b.x1 - b.x0)}" height="${f1(b.y1 - b.y0)}" fill="#fff" fill-opacity="0"/></a>`; }).join('');
    const d = pl.drawn, sc = Math.min(RP_CW / d.w, avail / d.h);
    lg.before(frag(`<div class="rp-fig"><svg width="${f1(d.w * sc)}" height="${f1(d.h * sc)}" viewBox="${d.x} ${f1(d.y)} ${d.w} ${f1(d.h)}" font-family="${FONT}">${pl.body}${pinLinks(model, pl.hits)}${tagA}</svg></div>`));
    if (houseOnPlan) {
      const r = renderCut(doc, geo, { W: RP_CW, H: houseOnPlan.h, uid: 'ov' });
      lg.before(frag(`<div class="rp-fig" id="p-overview"><svg class="rp-cut" width="${RP_CW}" height="${f1(r.H)}" viewBox="0 0 ${r.W} ${f1(r.H)}" font-family="${FONT}">${r.body}${pinLinks(model, r.hits)}</svg></div>`));
      body.querySelector('h1').textContent = 'The house: plan and 3D';
    }
  }

  /* 3a. the house in 3D: every wall lowered so every room shows; the same numbers as the plan; then the rooms
     that have a page of their own, as an index */
  if (iso3d && !houseOnPlan) {
    const body = page('overview', 'p-overview');
    body.append(frag(`<h1>The house in 3D</h1>`));
    body.append(frag(`<p class="rp-lede">The plan in three dimensions, every wall lowered to ${Math.round(ISO_LOW * 1000)} mm so each room can be seen. Numbers match the plan; wall readings are shown at the foot of their wall. Each room follows on its own page.</p>`));
    const lg = frag(`<div class="rp-keyrow">${keyHTML(cutLegendRows(doc, geo, null, false))}</div>`);
    body.append(lg);
    const idx = pagedRooms.length ? frag(`<div class="rp-ridx"><h2>Rooms</h2><table><thead><tr><th>Room</th><th class="n">Floor</th><th class="n">Readings</th><th class="n">Highest</th><th>Removals</th><th class="n">Page</th></tr></thead><tbody>` +
      pagedRooms.map(r => {
        const rd = model.items.filter(it => it.room === r && it.type === 'reading' && it.status !== 'ref' && isNum(it.x.value) && it.x._measured !== false), hi = rd.slice().sort((a, b) => b.x.value - a.x.value)[0];
        return `<tr><td><a href="#room-${safeId(r.id)}"><b>${esc(roomName(r))}</b></a></td><td class="n">${fmtArea(r.area)}</td><td class="n">${model.items.filter(it => it.room === r && it.type === 'reading').length || '—'}</td><td class="n">${hi ? `<span class="rp-dot ${hi.status}"></span>${fmtVal(hi.x.value)} (${esc(hi.ref)})` : '—'}</td><td>${remsOf(r).map(x => tagHTML(x.id)).join(' ') || '—'}</td><td class="n">${pref('room-' + safeId(r.id))}</td></tr>`;
      }).join('') + '</tbody></table></div>') : null;
    if (idx) body.append(idx);
    if (idx && RP_BODY_H - usedH(body) < 330) idx.remove();
    const r = renderCut(doc, geo, { W: RP_CW, H: RP_BODY_H - usedH(body) - 14, tight: true, uid: 'ov' });
    lg.before(frag(`<div class="rp-fig"><svg class="rp-cut" width="${RP_CW}" height="${f1(r.H)}" viewBox="0 0 ${r.W} ${f1(r.H)}" font-family="${FONT}">${r.body}${pinLinks(model, r.hits)}</svg></div>`));
  }
  /* 4. rooms: the room on its own plan (where) above its cutaway from the eye (how high); beside them the room's
     numbers with value and height, its removals and the key. A second, opposite view when the other walls carry
     items too; each number is listed once, on the first view that shows it. */
  const DW = 350, SW = RP_CW - DW - 14;
  for (const room of pagedRooms) {
    const its = model.items.filter(it => it.room === room), pair = pairRooms.includes(room);
    const walls = geo.walls.filter(w => [0.25, 0.5, 0.75].some(t => [1, -1].some(sg => pointInPolygon(add(lerp(w.a, w.b, t), mul(w.n, sg * (HW + 0.15))), room.poly))));
    const bb = bboxOf(room.poly);
    const dims = `<p class="rp-dims">Floor area ${room.area.toFixed(1)} m² · extent about ${(bb.x1 - bb.x0).toFixed(2)} × ${(bb.y1 - bb.y0).toFixed(2)} m · walls ${walls.filter(w => w.L >= 0.3).map(w => fmtM(w.L) + (model.elevByWall.has(w.id) ? ' (' + model.elevByWall.get(w.id).letter + ')' : '')).join(', ')}</p>`;
    const views = pair ? cutViews(doc, geo, room).views : [];
    const firstSeen = it => { const i = views.findIndex(q => itemSeen(model, it.x, q)); return i < 0 ? 0 : i; };
    const rems = remsOf(room);
    (views.length ? views : [null]).forEach((q, vi) => {
      const body = page('room', 'room-' + safeId(room.id) + (vi ? '-v' + (vi + 1) : ''));
      body.append(frag(`<h1>${esc(roomName(room))}${views.length > 1 ? ` <span class="rp-cont">· view ${vi + 1} of ${views.length}</span>` : ''}</h1>`));
      body.append(frag(vi ? `<p class="rp-dims">The opposite walls, from eye ${vi + 1}. Numbers listed on the first view are not repeated here.</p>` : dims));
      const mine = its.filter(it => !views.length || firstSeen(it) === vi);
      const side = `<div class="rp-rside">${mine.length ? `<div class="rp-sh">${views.length ? 'Numbers on this view' : 'Numbers in this room'}</div>${pinTable(mine, true)}` : ''}` +
        (vi === 0 && rems.length ? `<div class="rp-sh">Removals</div>${worksHTML(rems)}` : '') +
        `<div class="rp-sh">Key</div>${keyHTML([...cutLegendRows(doc, geo, room, false), ...(views.length ? [{ sym: 'eye', text: 'Eye of the view' }] : [])])}</div>`;
      const avail = RP_BODY_H - usedH(body) - 6, tagH = 14;
      if (q == null) {
        const pl = roomPlanSVG(model, room, DW, avail - tagH, [], -1, remRefs);
        body.append(frag(`<div class="rp-room"><div class="rp-rdraw"><div class="rp-ptag"><b>Plan</b> · the room and its numbers</div>${pl.svg}</div>${side}</div>`));
        return;
      }
      // the cutaway at the column width (no taller than 60% of the space); the plan takes what is left
      const r = renderCut(doc, geo, { room, q, W: DW, H: Math.round((avail - 2 * tagH - 12) * 0.6), tight: true, tags: remRefs, uid: 'p' + safeId(room.id) + vi });
      const pl = roomPlanSVG(model, room, DW, Math.round(avail - 2 * tagH - 12 - r.H), views, vi, remRefs);
      body.append(frag(`<div class="rp-room"><div class="rp-rdraw"><div class="rp-ptag"><b>Plan</b> · ${views.length > 1 ? `eye ${vi + 1} (filled) marks the view below` : 'the eye marks the view below'}</div>${pl.svg}` +
        `<div class="rp-ptag rp-pt2"><b>View ${vi + 1}${views.length > 1 ? ' of ' + views.length : ''}</b> · from the eye, near walls lowered; pins at their measured height</div>` +
        `<svg class="rp-cut" width="${DW}" height="${f1(r.H)}" viewBox="0 0 ${r.W} ${f1(r.H)}" font-family="${FONT}">${r.body}${pinLinks(model, r.hits)}${tagLinks(r.info)}</svg></div>${side}</div>`));
      if (over(body)) body.querySelector('.rp-rside').classList.add('tight');
    });
  }

  /* 4b. drying filmstrip (monitoring, final): each room from the same eye on every visit; the frames carry the
     geometry, wet zone, removals and numbered pins only; each point's value per visit is in the table under them */
  if (dm && iso3d && pairRooms.length) {
    const vs = visitsOf(baseDoc).filter(v => visitIdx(baseDoc, v.id) <= visitIdx(baseDoc, vid)), shown = vs.length > 3 ? [vs[0], ...vs.slice(-2)] : vs, tcols = vs.length > 6 ? [vs[0], ...vs.slice(-5)] : vs;
    // three frames fill the width; with fewer visits the table sits beside the frames
    const cols = Math.max(3, shown.length), gap = 6, cw = Math.floor((RP_CW - (cols - 1) * gap) / cols), chH = Math.round(cw * 0.86), beside = shown.length < 3;
    const rows = pairRooms.map(room => {
      const q = cutViews(doc, geo, room).views[0];
      const cells = shown.map(v => {
        const r = renderCut(viewDoc(baseDoc, v.id), geo, { room, q, W: cw, H: chH, tight: true, variant: 'film', uid: 'f' + safeId(room.id) + v.id });
        return `<div class="rp-film"><svg width="${cw}" height="${f1(r.H)}" viewBox="0 0 ${r.W} ${f1(r.H)}" font-family="${FONT}">${r.body}</svg><div class="rp-fcap"><b>Visit ${v.n}</b> · ${esc(visitDayLabel(v) || '')}</div></div>`;
      });
      const pts = dm.points.filter(p => p.room === room).map(p => ({ p, it: model.byId.get(p.r.id) })).filter(o => o.it);
      const order = sortItems(pts.map(o => o.it)).map(it => pts.find(o => o.it === it).p);
      const cell = (p, v) => { if (!p.byVisit.has(v.id)) return `<td class="n rp-cell none">—</td>`; const val = p.byVisit.get(v.id); return `<td class="n rp-cell ${statusOf({ kind: 'reading', value: val, reference: p.reference }, thr)}">${fmtVal(val)}</td>`; };
      const tbl = order.length ? `<table class="rp-mini rp-ftab"><thead><tr><th>No.</th><th>Point</th>${tcols.map(v => `<th class="n">Visit ${v.n}</th>`).join('')}</tr></thead><tbody>` +
        order.map(p => `<tr><td class="rp-ref"><a href="#r-${safeId(p.r.id)}">${esc(p.ref)}</a></td><td>${esc(p.where.replace(roomName(room) + ' · ', ''))}</td>${tcols.map(v => cell(p, v)).join('')}</tr>`).join('') + '</tbody></table>' : '';
      return `<div class="rp-filmrow"><div class="rp-ptag"><b>${esc(roomName(room))}</b> · <a href="#room-${safeId(room.id)}">plan and 3D <span data-pref="room-${safeId(room.id)}">p.&#8202;?</span></a></div>` +
        (beside ? `<div class="rp-filmside"><div class="rp-films n">${cells.join('')}</div><div>${tbl}</div></div>` : `<div class="rp-films c${cols}">${cells.join('')}</div>${tbl}`) + '</div>';
    });
    flow('film', 'Drying progress in 3D', [`<p class="rp-lede">Each room from the same eye on ${shown.length < vs.length ? `visits ${shown.map(v => v.n).join(', ')} (the first and the last two)` : 'every visit'}: the wet zone below the moisture line, the removals and the numbered points as measured that day. Each point's value on every visit is in the table with its room; nothing is drawn between visits.</p>`, ...rows], 'p-film');
  }

  /* 3b. drying progress: the points (rows) over the visits (columns), then a small chart per point */
  if (dm && dm.points.length) {
    const vcols = dm.visits.length > 6 ? [dm.visits[0], ...dm.visits.slice(-5)] : dm.visits;
    const cell = (p, v) => { if (!p.byVisit.has(v.id)) return `<td class="n rp-cell none">—</td>`; const val = p.byVisit.get(v.id), s0 = statusOf({ kind: 'reading', value: val, reference: p.reference }, thr); return `<td class="n rp-cell ${s0}">${fmtVal(val)}</td>`; };
    const chg = p => { if (!p.measured || p.prev == null) return `<td class="n rp-chg">—</td>`; const d = Math.round((p.value - p.prev) * 10) / 10; return `<td class="n rp-chg ${p.trend}">${d > 0 ? '+' : d < 0 ? '−' : '±'}${Math.abs(d)}</td>`; };
    const rows = dm.points.map(p => { const it = model.byId.get(p.r.id); return `<tr id="r-${safeId(p.r.id)}"><td class="rp-ref">${it && it.card ? `<a href="#${it.cardId}">${esc(p.ref)}</a>` : esc(p.ref)}</td><td>${esc(p.where)}</td>${vcols.map(v => cell(p, v)).join('')}${chg(p)}<td class="c">${p.atGoal ? goalTickSVG() : ''}</td></tr>`; });
    const headHTML = `<tr><th>No.</th><th>Point</th>${vcols.map(v => `<th class="n">${esc(visitDayLabel(v) || 'Visit ' + v.n)}<br><span class="rp-sub">V${v.n}</span></th>`).join('')}<th class="n">Change</th><th class="c">Goal</th></tr>`;
    const c = dm.counts;
    const body = flowTable('progress', 'Drying progress', `${c.down} lower, ${c.level} within 1 point and ${c.up} higher than the previous visit; ${c.atGoal} of ${c.measured} at or below the drying goal of ${esc(dm.goal.label)} (this job's goal, a display aid and not a standard). Colours use the job's status bands (${thr.damp}% / ${thr.wet}%). Change is this visit minus the previous visit, in percentage points.`,
      headHTML, rows, '', 'p-progress');
    body.querySelectorAll('table').forEach(t => t.classList.add('rp-prog'));
    // charts, three to a row
    const charted = dm.points.filter(p => !p.reference && p.hist.length);
    const rowsHTML = [];
    for (let i = 0; i < charted.length; i += 3) rowsHTML.push(`<div class="rp-charts">${charted.slice(i, i + 3).map(p => `<div class="rp-chartbox"><div class="rp-ct"><b>${esc(p.ref)}</b> ${esc(p.where)}</div><div class="rp-cv">${p.hist.length > 1 ? `${fmtVal(p.hist[0].value)} → ` : ''}<span class="${p.status}">${fmtVal(p.measured ? p.value : p.latest.value)}</span>${p.measured ? '' : ' (earlier)'}</div>${dryingChart(dm, p)}</div>`).join('')}</div>`);
    if (rowsHTML.length) {
      // the charts follow the table, on the same page while they fit
      const lede = `<p class="rp-lede">Value at each visit, on the visit dates (one scale for every chart). Dashed green: drying goal ${esc(dm.goal.label)}. ${dm.refs.length ? 'Dotted grey: reference reading. ' : ''}The last value is coloured by status. Lines join measured values only.</p>`;
      let b2 = body, first = true;
      const head = frag(`<div id="p-charts"><h2>By point</h2>${lede}</div>`);
      b2.append(head);
      const blocks = rowsHTML.map(frag);
      if (over(b2) || (b2.append(blocks[0]), over(b2))) { head.remove(); blocks[0].remove(); b2 = page('charts'); b2.append(frag(`<div id="p-charts"><h1>Drying progress by point</h1>${lede}</div>`)); first = false; }
      for (const [i, el2] of blocks.entries()) {
        if (i === 0 && first) continue;
        b2.append(el2);
        if (over(b2)) { el2.remove(); b2 = page('charts'); b2.append(frag(`<h1>Drying progress by point <span class="rp-cont">(continued)</span></h1>`)); b2.append(el2); }
      }
    }
  }

  /* 8c. proposed scope of works and quotation (initial report) */
  if (initial && baseDoc.markup.scope) {      // once the scope has been set up in Scope & quote
    const sc = scopeOf(baseDoc), lines = qLines;
    // the proposed works in 3D, room by room: each removal tagged, and listed beside with its size and quote line
    if (lines.length && iso3d) {
      let body = null, n = 0;
      for (const room of netRooms(doc, geo, true)) {
        if (!body || n === 2) { body = page('works', body ? null : 'p-works'); body.append(frag(n === 2 ? `<h1>Proposed works <span class="rp-cont">(continued)</span></h1>` : `<h1>Proposed works</h1>`)); if (!n) body.append(frag(`<p class="rp-lede">What is to be removed or lifted, room by room. Each tag (X on a wall, F on the floor) is listed with its size and the quotation line that prices it; the removal schedule has the full list.</p>`)); n = 0; }
        const r = renderCut(doc, geo, { room, variant: 'works', W: DW, H: 296, tight: true, tags: remRefs, uid: 'w' + safeId(room.id) });
        body.append(frag(`<div class="rp-wcut"><div class="rp-ptag"><b>${esc(roomName(room))}</b> · <a href="#room-${safeId(room.id)}">plan and 3D <span data-pref="room-${safeId(room.id)}">p.&#8202;?</span></a></div><div class="rp-room"><div class="rp-rdraw"><svg class="rp-cut" width="${DW}" height="${f1(r.H)}" viewBox="0 0 ${r.W} ${f1(r.H)}" font-family="${FONT}">${r.body}${tagLinks(r.info)}</svg></div><div class="rp-rside">${worksHTML(remsOf(room))}</div></div></div>`));
        n++;
      }
    }
    if (lines.length) {
      const anyDays = lines.some(l => l.days != null);
      const rows = lines.map((l, i) => `<tr><td class="rp-ref">${i + 1}</td><td>${esc(l.desc)}${(l.refs || []).some(id => remRefs.has(id)) ? ' ' + l.refs.filter(id => remRefs.has(id)).map(tagHTML).join(' ') : ''}${l.note ? `<br><span class="rp-cont">${esc(l.note)}</span>` : ''}</td><td class="n">${fmtQty(l.qty)}</td><td>${esc(l.unit)}</td>${anyDays ? `<td class="n">${l.days != null ? fmtQty(l.days) : ''}</td>` : ''}</tr>`);
      flowTable('scope', 'Proposed scope of works', 'What is proposed, and where, from the plan and markup in this report. Quantities from the plan are approximate (LiDAR scan).',
        `<tr><th>No.</th><th>Item</th><th class="n">Qty</th><th>Unit</th>${anyDays ? '<th class="n">Days</th>' : ''}</tr>`, rows, '', 'p-scope', 260);
      const t = scopeTotals(lines, sc.gst);
      if (t.priced) {
        const qd = dayMs(visit.date) ?? Date.now(), until = new Date(qd + sc.validDays * 86400000);
        const qrows = lines.map((l, i) => `<tr><td class="rp-ref">${i + 1}</td><td>${esc(l.desc)}</td><td class="n">${fmtQty(l.qty)} ${esc(l.unit)}${l.days != null ? ` × ${fmtQty(l.days)} d` : ''}</td><td class="n">${l.rate != null ? money(l.rate) : ''}</td><td class="n">${l.amount != null ? money(l.amount) : '<span class="rp-cont">not priced</span>'}</td></tr>`);
        const foot = `<tr><td></td><td colspan="3">Subtotal (ex GST)</td><td class="n">${money(t.sub)}</td></tr><tr><td></td><td colspan="3">GST ${fmtQty(sc.gst * 100)}%</td><td class="n">${money(t.gst)}</td></tr><tr class="rp-total"><td></td><td colspan="3">Total (inc GST), AUD</td><td class="n">${money(t.total)}</td></tr>`;
        const body = flowTable('quotation', 'Quotation', `Reference ${esc(ref || '—')} · dated ${esc(fmtDay(qd))} · valid until ${esc(fmtDay(until.getTime()))}. Prices in Australian dollars.`,
          `<tr><th>No.</th><th>Item</th><th class="n">Quantity</th><th class="n">Rate</th><th class="n">Amount</th></tr>`, qrows, foot, 'p-quote');
        if (sc.terms) { const tp = frag(`<div><h2>Terms</h2><p class="rp-free">${esc(sc.terms)}</p></div>`); body.append(tp); if (over(body)) { tp.remove(); flow('quotation', 'Quotation', [`<h2>Terms</h2>`, `<p class="rp-free">${esc(sc.terms)}</p>`]); } }
      }
    }
  }

  /* 8d. works completed (monitoring, final): each removal as quoted, its status, and before / after photos */
  if (!initial && remRefs.size) {
    const blocks = [`<p class="rp-lede">Each removal as proposed${qLines.length ? ' and quoted' : ''}, where it is, and whether it has been done. Photos: before (when the strip-out was recorded) and after (the visit it was done).</p>`];
    const img = (p, cap) => { if (!p) return `<div class="rp-wdph none">${cap}: no photo</div>`; const sz = imageSize(p.photo) || { w: 4, h: 3 }, kk = Math.min(118 / sz.w, 88 / sz.h), pv = visitById(baseDoc, p.visit || 'v1'); return `<div class="rp-wdph"><img src="${esc(p.photo)}" width="${f1(sz.w * kk)}" height="${f1(sz.h * kk)}" alt=""><span>${cap} · visit ${pv.n}${visitDayLabel(pv) ? ' · ' + esc(visitDayLabel(pv)) : ''}</span></div>`; };
    const order = [...m.removals.filter(x => geo.wallById.has(x.wallId)), ...m.removals.filter(isFloorRemoval)];
    order.forEach((x, i) => {
      const r = remInfo(x), w = geo.wallById.get(x.wallId), dv = x._done ? visitById(baseDoc, x.doneVisit || itemVisit(x)) : null;
      const ph = Array.isArray(x.photos) ? x.photos.filter(p => isImageURL(p.photo) && visitIdx(baseDoc, p.visit || 'v1') <= visitIdx(baseDoc, vid)) : [];
      const key = r.room ? cutKey(model, r.room, w ? { wall: w.id, side: itemSide(w, x) || markupSide(geo, doc, w, model.memo), removal: x, W: 128, H: 92, uid: 'wd' + i } : { W: 128, H: 92, uid: 'wd' + i }) : '';
      blocks.push(`<div class="rp-wd${x._done ? ' done' : ''}" id="wd-${safeId(x.id)}"><div class="rp-wdk">${key}</div><div class="rp-wdt">${tagHTML(x.id)} <b>${esc(r.what)}</b> — ${esc(r.room ? roomName(r.room) : '')}${r.wall ? ', wall ' + r.wall.letter : w ? '' : ' floor'}<br>${esc(r.size)}${qRef.has(x.id) ? ` · quotation line ${qRef.get(x.id)}` : ''}<br>` +
        `<span class="rp-wds">${dv ? `Done on visit ${dv.n}${visitDayLabel(dv) ? ' (' + esc(visitDayLabel(dv)) + ')' : ''}` : 'Outstanding'}</span>${x.note ? `<br><span class="rp-cont">${esc(x.note)}</span>` : ''}</div>` +
        `<div class="rp-wdp">${img(ph.find(p => p.stage !== 'after'), 'Before')}${img(ph.filter(p => p.stage === 'after').pop(), 'After')}</div></div>`);
    });
    flow('worksdone', 'Works completed', blocks, 'p-worksdone');
  }

  /* 6. evidence cards, two per page */
  if (model.cards.length) {
    const cardHTML = it => {
      const x = it.x, sz = it.photo ? imageSize(it.photo) : null;
      const title = it.type === 'source' ? `Water source ${it.ref}` : it.type === 'reading' ? `Reading ${it.ref}` : it.type === 'photo' ? `Photo ${it.ref}` : `Moisture line point ${it.ref}`;
      const where = placeTxt(it);
      const badge = it.type === 'reading' ? it.status : it.type === 'source' ? 'src' : it.type;
      // a later visit's reading: the first-visit photo of the same point, small, under this visit's photo
      const firstE = !initial && it.type === 'reading' && x._hist && x._hist[0] && (x._hist[0].visit || 'v1') !== vid && isImageURL(x._hist[0].photo) ? x._hist[0] : null;
      const fsz = firstE ? imageSize(firstE.photo) : null;
      const mainH = fsz ? 158 : 226, kk = sz ? Math.min(300 / sz.w, mainH / sz.h) : 1;
      let photo = sz ? `<img src="${esc(it.photo)}" width="${f1(sz.w * kk)}" height="${f1(sz.h * kk)}" alt="">` : `<div class="rp-nophoto">The photo could not be read</div>`;
      if (fsz) { const k2 = Math.min(84 / fsz.w, 60 / fsz.h), fv = visitById(model.doc.markup._base || model.doc, firstE.visit || 'v1'); photo = `<div class="rp-ph2">${photo}<div class="rp-first"><img src="${esc(firstE.photo)}" width="${f1(fsz.w * k2)}" height="${f1(fsz.h * k2)}" alt=""><span>Same point on visit ${fv.n}${visitDayLabel(fv) ? ' · ' + esc(visitDayLabel(fv)) : ''}<br><b>${fmtVal(firstE.value)}</b></span></div></div>`; }
      const big = it.type === 'reading' ? `<span class="big ${it.status}">${fmtVal(x.value)}</span><span class="st">${STATUS_LABEL[it.status]}</span>`
        : it.type === 'source' ? `<span class="big src sm">${esc(x.label || 'Water source')}</span>` : '';
      const dl = [];
      if (it.w && isNum(x.height)) dl.push(['Height', mmLabel(x.height) + ' above floor']);
      if (it.type === 'reading' && x.material) dl.push(['Material', x.material[0].toUpperCase() + x.material.slice(1)]);
      if (it.type === 'reading' && x.reference) dl.push(['Reference', 'Dry control, unaffected area']);
      if (!initial && it.type === 'reading' && x._prev != null) { const ph = x._hist[x._hist.length - 2], pv = visitById(model.doc.markup._base || model.doc, ph.visit || 'v1'); dl.push(['Previous', `${fmtVal(x._prev)} on visit ${pv.n}${visitDayLabel(pv) ? ' (' + visitDayLabel(pv) + ')' : ''}`]); }
      dl.push(['Taken', when(it.t)]);
      if (x.source === 'ar' || x.source === 'manual') dl.push(['Recorded', x.source === 'ar' ? 'In the app during the scan' : 'Added by hand']);
      const texts = [];
      const cap = it.type === 'source' ? x.label : x.note;
      if (cap && cap.trim() && it.type !== 'source') texts.push(`<p>${esc(cap.trim())}</p>`);
      const nn = nearestNote(m, it.t);
      if (nn) { const nt = timeOf(nn.t); texts.push(`<div class="rp-quote">${micSVG(10)}<div>“${esc(String(nn.text).trim())}” <small>${nn.source === 'typed' ? 'typed note' : 'said'} at ${esc(fmtClock(nt))}</small></div></div>`); }
      return `<div class="rp-card" id="${it.cardId}" data-item="${esc(x.id)}"><div class="rp-ctop2"><span class="rp-badge ${badge}">${esc(it.ref)}</span><div class="rp-ctitle2">${esc(title)}${where ? ' · ' + esc(where) : ''}</div></div>` +
        `<div class="rp-cgrid"><div class="rp-cphoto">${photo}</div><div class="rp-cside"><div class="rp-maps">${locatorSVG(model, it, iso3d && it.room ? 120 : 195, 124)}${iso3d && it.room ? cutKey(model, it.room, { wall: it.w ? it.w.id : null, side: it.w ? itemSide(it.w, x) || markupSide(geo, doc, it.w, model.memo) : null, item: x, color: it.type === 'reading' ? (C[it.status] || C.ref) : it.type === 'source' ? C.water : C.photo, W: 71, H: 124, uid: 'cd' + safeId(x.id) }) : ''}</div><div class="rp-mapcap">${esc(it.room ? roomName(it.room) + ' · ' + fmtArea(it.room.area) : 'Location on the plan')}${isPt(x.cam) ? ' · camera position and view marked' : ''}</div>` +
        (big ? `<div class="rp-val">${big}</div>` : '') + `<dl class="rp-dl">${dl.map(([k2, v]) => `<dt>${esc(k2)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div></div>` +
        (texts.length ? `<div class="rp-ctext">${texts.join('')}</div>` : '') +
        `<div class="rp-back"><a href="#p-plan">Back to plan <span data-pref="p-plan">p.&#8202;?</span></a>${it.room && rep.include.roomPages && initial ? ` · <a href="#room-${safeId(it.room.id)}">${esc(roomName(it.room))} <span data-pref="room-${safeId(it.room.id)}">p.&#8202;?</span></a>` : ''}</div></div>`;
    };
    let body = null, slots = 0, firstPage = true;
    const newCardPage = () => {
      body = page('cards', firstPage ? 'p-cards' : null);
      body.append(frag(firstPage ? `<h1>Evidence</h1>` : `<h1>Evidence <span class="rp-cont">(continued)</span></h1>`));
      firstPage = false; slots = 0;
    };
    for (const it of model.cards) {
      const el = frag(cardHTML(it));
      if (!body || slots >= 2) newCardPage();
      body.append(el); slots++;
      if (over(el)) { el.classList.add('tight'); }
      if (over(el)) {
        // too much text for half a page: give the card a page of its own
        el.classList.remove('tight'); el.classList.add('solo');
        if (slots > 1) { el.remove(); newCardPage(); body.append(el); }
        slots = 2;
        if (over(el)) el.classList.add('tight');
      }
    }
  }

  /* 5. wall elevations at one common scale, as many to a page as fit (the key at the foot of each page) */
  if (model.elevs.length) {
    const blocks = model.elevs.map(e => elevationBlock(e, doc, geo));
    const k = Math.min(RP_CW / Math.max(...blocks.map(b2 => b2.w)), 300 / Math.max(...blocks.map(b2 => b2.h)), 1);
    const lgBlocks = elevationLegend(blocks, doc, 0, 12, 640);
    const lgHTML = lgBlocks.h ? `<div class="rp-fig"><svg width="${RP_CW}" height="${f1((lgBlocks.h + 14) * RP_CW / 680)}" viewBox="0 0 680 ${f1(lgBlocks.h + 14)}" font-family="${FONT}">${ELEV_DEFS}${lgBlocks.svg}</svg></div>` : '';
    let body = null, lg = null;
    const fresh = first => {
      body = page('elev', first ? 'p-elev' : null);
      body.append(frag(first ? `<h1>Wall elevations</h1>` : `<h1>Wall elevations <span class="rp-cont">(continued)</span></h1>`));
      if (first) body.append(frag(`<p class="rp-lede">Each wall as seen from inside the room, drawn to scale. Readings sit at their measured height.</p>`));
      lg = lgHTML ? frag(lgHTML) : null; if (lg) body.append(lg);
    };
    blocks.forEach((b2, i) => {
      if (!body) fresh(true);
      const links = b2.hits.filter(h => h.kind === 'reading' || h.kind === 'source').map(h => { const it = model.byId.get(h.id); return it && it.target ? `<a href="#${it.target}" class="rp-pin" data-item="${esc(it.x.id)}"><circle cx="${f1(h.c[0])}" cy="${f1(h.c[1])}" r="${f1(Math.max(h.r, 9))}" fill="#fff" fill-opacity="0"/></a>` : ''; }).join('');
      const ek = iso3d && b2.e.room ? `<div class="rp-ekey">${cutKey(model, b2.e.room, { wall: b2.e.w.id, side: b2.e.side, W: 104, H: 64, uid: 'e' + b2.e.letter })}Wall ${b2.e.letter} in 3D</div>` : '';
      const fig = frag(`<div class="rp-fig${ek ? ' rp-keyed' : ''}"><svg width="${f1(b2.w * k)}" height="${f1(b2.h * k)}" viewBox="0 0 ${b2.w} ${b2.h}" font-family="${FONT}">${ELEV_DEFS}${b2.body}${links}</svg>${ek}</div>`);
      const put = () => { if (lg) lg.before(fig); else body.append(fig); };
      put();
      if (over(body) && body.querySelectorAll('.rp-fig svg').length > (lg ? 2 : 1)) { fig.remove(); fresh(false); put(); }
    });
  }

  /* 3c. rooms unfolded: one room a page, walls folded down round the floor; pins link like the plan's */
  netRoomList.forEach((room, i) => {
    const body = page('net', i === 0 ? 'p-net' : 'net-' + safeId(room.id));
    body.append(frag(`<h1>Rooms unfolded <span class="rp-cont">· ${esc(roomName(room))}</span></h1>`));
    const n = renderRoomNet(doc, geo, room, { variant: 'pins', W: NET_RW, H: (RP_BODY_H - 46) * NET_RW / RP_CW, title: false, uid: 'r' + i });
    body.append(frag(`<div class="rp-fig"><svg class="rp-net" width="${RP_CW}" height="${f1(n.H * RP_CW / n.W)}" viewBox="0 0 ${n.W} ${f1(n.H)}" font-family="${FONT}">${n.body}${pinLinks(model, n.hits)}</svg></div>`));
  });

  /* 7. readings table */
  if (initial && rep.include.readingsTable && readings.length) {
    const rows = readings.slice().sort((a, b) => (a.n ?? 0) - (b.n ?? 0)).map(it => {
      const x = it.x;
      return `<tr id="${it.rowId}"><td class="rp-ref">${it.card ? `<a href="#${it.cardId}">${esc(it.ref)}</a>` : esc(it.ref)}</td><td>${esc(it.room ? roomName(it.room) : '—')}</td><td>${esc(it.elev ? it.elev.letter : it.w ? 'wall' : 'floor')}</td><td>${esc(x.material || '—')}</td><td class="n">${it.w && isNum(x.height) ? Math.round(x.height * 1000) : '—'}</td><td class="n"><b>${fmtVal(x.value)}</b></td><td><span class="rp-dot ${it.status}"></span>${STATUS_LABEL[it.status]}</td><td class="c">${x.reference ? 'Yes' : ''}</td><td class="n">${it.card ? pref(it.cardId) : '—'}</td></tr>`;
    });
    flowTable('table', 'Moisture readings', `Values as displayed by the meter${m.meter ? ' (' + esc(m.meter) + ')' : ''}; comparative, not absolute. Status bands: dry below ${thr.damp}%, elevated ${thr.damp}–${thr.wet}%, wet ${thr.wet}% and over.`,
      `<tr><th>No.</th><th>Room</th><th>Wall</th><th>Material</th><th class="n">Height mm</th><th class="n">Value</th><th>Status</th><th class="c">Ref.</th><th class="n">Card</th></tr>`, rows, '', 'p-readings', 260);
  }

  /* 8. removal schedule: every removal with its reference (as tagged on the drawings), linked to its room page */
  if (remRefs.size) {
    const roomLink = r => !r ? '—' : pagedRooms.includes(r) ? `<a href="#room-${safeId(r.id)}">${esc(roomName(r))}</a>` : esc(roomName(r));
    const status = x => multi ? (x._done ? `<b>Done</b> · visit ${visitById(baseDoc, x.doneVisit || itemVisit(x)).n}` : 'Proposed') + (x.note ? ' · ' : '') : '';
    const rows = rems.map(x => {
      const w = geo.wallById.get(x.wallId), e = model.elevByWall.get(w.id), Lr = removalLen(x, w), hM = removalHeightM(x, w), item = ITEMS[x.item] ? x.item : 'other';
      return `<tr id="x-${safeId(x.id)}"><td class="rp-ref"><span class="rp-tag">${esc(remRefs.get(x.id))}</span></td><td>${roomLink(readingRoom(geo, doc, x, model.memo))}</td><td>${esc(e ? e.letter : '—')}</td><td>${ITEMS[item].label}</td><td class="n">${Lr.toFixed(2)}</td><td class="n">${hM > 0 ? Math.round(hM * 1000) : '—'}</td><td class="n">${Lr * hM > 0 ? (Lr * hM).toFixed(2) : '—'}</td>${qRef.size ? `<td class="n">${qRef.get(x.id) || '—'}</td>` : ''}<td>${status(x)}${esc(x.note || '')}</td></tr>`;
    });
    // flooring lifted (drawn on the floor): one row each, by area
    for (const x of m.removals.filter(isFloorRemoval)) {
      const q = floorRemovalQty(doc, geo, x);
      rows.push(`<tr id="x-${safeId(x.id)}"><td class="rp-ref"><span class="rp-tag">${esc(remRefs.get(x.id))}</span></td><td>${roomLink(q.room)}</td><td>floor</td><td>${esc(FLOOR_TYPES[q.type])}${x.underlay ? ' + underlay' : ''}</td><td class="n">—</td><td class="n">—</td><td class="n">${q.m2.toFixed(2)}</td>${qRef.size ? `<td class="n">${qRef.get(x.id) || '—'}</td>` : ''}<td>${status(x)}${esc(x.note || '')}</td></tr>`);
    }
    const qc = qRef.size ? '<td></td>' : '';
    const foot = [...remTotals].map(([item, t]) => `<tr><td></td><td colspan="3">${ITEMS[item].label}</td><td class="n">${t.lm.toFixed(2)}</td><td></td><td class="n">${t.m2 > 0 ? t.m2.toFixed(2) : '—'}</td>${qc}<td></td></tr>`).join('') +
      `<tr><td></td><td colspan="3">All removals</td><td class="n">${remL.toFixed(2)}</td><td></td><td class="n">${remA.toFixed(2)}</td>${qc}<td></td></tr>`;
    flowTable('removals', 'Removal schedule', `Lengths along the wall; heights from the floor. Area = length × height. X: along a wall; F: flooring lifted, area inside the room.${qRef.size ? ' Quote: the quotation line that prices it.' : ''}`,
      `<tr><th>Ref</th><th>Room</th><th>Wall</th><th>Item</th><th class="n">Length m</th><th class="n">Height mm</th><th class="n">Area m²</th>${qRef.size ? '<th class="n">Quote</th>' : ''}<th>${multi ? 'Status · note' : 'Note'}</th></tr>`, rows, foot, 'p-removals', 230);
  }

  /* 8b. equipment: the drying plan (initial), on site with days running (monitoring), the schedule (final) */
  {
    const all = equipOf(baseDoc.markup), shown = rtype === 'final' ? all.filter(x => visitIdx(baseDoc, x.placed || 'v1') <= visitIdx(baseDoc, vid)) : equipOf(doc.markup);
    if (shown.length) {
      const title = initial ? 'Drying plan' : rtype === 'final' ? 'Drying equipment' : 'Equipment on site';
      const body = page('equip', 'p-equip');
      body.append(frag(`<h1>${title}</h1>`));
      body.append(frag(`<p class="rp-lede">${initial ? 'Drying equipment placed on this visit.' : rtype === 'final' ? 'All drying equipment used on this job, with the visits it was placed and removed.' : 'Drying equipment on site at this visit, and days since it was placed.'} Counts: ${esc(equipCounts(shown))}.</p>`));
      const rows = shown.map((x, i) => { const pv = visitById(baseDoc, x.placed || 'v1'), rv = x.removed ? visitById(baseDoc, x.removed) : null, dd = daysOnSite(baseDoc, x, vid);
        return `<tr><td class="rp-ref">${esc(EQUIP[equipType(x)].code)}</td><td>${esc(EQUIP[equipType(x)].label)}</td><td>${esc(x.label || '—')}</td><td>${esc((roomAt(geo, x.pos) ? roomName(roomAt(geo, x.pos)) : '—'))}</td><td>Visit ${pv.n}${visitDayLabel(pv) ? ' · ' + esc(visitDayLabel(pv)) : ''}</td><td>${rv && visitIdx(baseDoc, rv.id) <= visitIdx(baseDoc, vid) ? `Visit ${rv.n}${visitDayLabel(rv) ? ' · ' + esc(visitDayLabel(rv)) : ''}` : 'On site'}</td>${initial ? '' : `<td class="n">${dd != null ? dd : '—'}</td>`}</tr>`; });
      const tbl = frag(`<div><table><thead><tr><th>Code</th><th>Type</th><th>Label</th><th>Room</th><th>Placed</th><th>Removed</th>${initial ? '' : '<th class="n">Days</th>'}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`);
      body.append(tbl);
      const avail = Math.max(260, RP_BODY_H - tbl.offsetHeight - 80);
      const eqDoc = { ...doc, markup: { ...doc.markup, equipment: shown.map(x => ({ ...x, removed: null })), readings: [], removals: [] } };
      const lay = { ...ALL_LAYERS, dims: false, readings: false, removals: false, wetzones: false };
      const p0 = renderPlan(eqDoc, geo, { markup: true, bare: true, noTags: true, layers: lay });
      const k0 = Math.min(RP_CW / p0.drawn.w, avail / p0.drawn.h);
      const pl = renderPlan(eqDoc, geo, { markup: true, bare: true, noTags: true, layers: lay, pk: clamp(8 / (11 * k0), 0.6, 2.6), lk: clamp(8 / (15 * k0), 0.7, 2.2) });
      const d = pl.drawn, sc = Math.min(RP_CW / d.w, avail / d.h);
      tbl.before(frag(`<div class="rp-fig"><svg width="${f1(d.w * sc)}" height="${f1(d.h * sc)}" viewBox="${d.x} ${f1(d.y)} ${d.w} ${f1(d.h)}" font-family="${FONT}">${pl.body}</svg></div>`));
    }
  }

  /* 9. site notes (a monitoring report: that visit's notes) */
  const notes = rtype === 'monitoring' ? sortedNotes(m).filter(n => itemVisit(n) === vid) : sortedNotes(m);
  if (rep.include.notes && notes.length) {
    const days = new Set(notes.map(n => timeOf(n.t)).filter(t => t != null).map(fmtYMD));
    const rows = notes.map(n => {
      const t = timeOf(n.t), txt = String(n.text || '').trim();
      return `<tr><td>${t == null ? '—' : esc((days.size > 1 ? fmtDay(t).replace(/^\w+,?\s*/, '') + ' ' : '') + fmtClock(t))}</td><td>${n.source === 'typed' ? '' : micSVG(9)}</td><td>${txt ? esc(txt) : '<i>Not transcribed</i>'}${n.edited ? ' <span class="rp-cont">(corrected)</span>' : ''}</td></tr>`;
    });
    const zone = timeZoneName(), t0 = timeOf(notes.find(n => timeOf(n.t) != null)?.t);
    const body = flowTable('notes', 'Site notes', `Spoken during the inspection and transcribed on the device, word for word${notes.some(n => n.edited) ? ' (corrections marked)' : ''}. Times are local${zone ? ', ' + esc(zone.replace(/_/g, ' ')) : ''} (${esc(utcOffset(t0 ?? Date.now()))}).`, '', rows, '', 'p-notes', 170);
    body.querySelectorAll('table').forEach(t => t.classList.add('rp-notes'));
  }

  /* 10. method and limitations */
  if (rep.include.method) {
    const items = [
      m.meter ? `Moisture readings were taken with: ${esc(m.meter)}.` : 'The moisture meter used was not recorded.',
      'Readings are as displayed by the meter and are comparative; reference readings are taken from unaffected areas of the same material.',
      `Status colours use this job's display thresholds (elevated from ${thr.damp}%, wet from ${thr.wet}%). They are a display aid only and not an industry standard.`,
      'The moisture line joins the points marked on site along each wall; it is not extended beyond the outermost points and does not interpolate readings.',
      'Floor plans and dimensions come from a LiDAR scan of the property and are approximate.',
      ...(multi ? [`Return visits re-measure the same points. Each point's values are shown only for the visits on which it was measured; nothing is estimated between visits or between points. The drying goal (${esc(goalOf(baseDoc).label)}) is this job's display aid, not a standard.`] : []),
      `Report generated ${esc(fmtDay(Date.now()))} with SecureScan.`
    ];
    flow('method', 'Method and limitations', [`<ul class="rp-method">${items.map(t => `<li>${t}</li>`).join('')}</ul>`], 'p-method', 210);
  }

  /* 11. sign-off (final report) */
  if (rtype === 'final') {
    const party = (role, name) => `<div class="rp-sign"><b>${esc(role)}</b><div class="rp-sline"><span>Name</span>${esc(name || '')}</div><div class="rp-sline tall"><span>Signature</span></div><div class="rp-sline"><span>Date</span></div></div>`;
    flow('signoff', 'Sign-off', [`<p class="rp-lede">Signed to confirm the information recorded in this report.</p>`,
      completion ? `<ul class="rp-facts"><li>${esc(completion)}</li></ul>` : '<p></p>',
      `<div class="rp-signs">${party('Prepared by', rep.preparedBy)}${party('Client or builder', rep.preparedFor)}</div>`], 'p-signoff', 330);
  }

  for (const sec of pages) if (/\brp-(plan|overview|room|works|film|equip)\b/.test(sec.className)) compose(sec.querySelector('.rp-body'));

  /* page numbers and page references */
  const N = pages.length;
  const pageOf = id => { const el = host.querySelector('#' + id); const sec = el && el.closest('.rp-page'); return sec ? pages.indexOf(sec) + 1 : null; };
  pages.forEach((sec, i) => { const p = sec.querySelector('.rp-pno'); if (p) p.textContent = `Page ${i + 1} of ${N}`; });
  for (const el of host.querySelectorAll('[data-pref]')) { const p = pageOf(el.dataset.pref); el.innerHTML = p ? 'p.&#8202;' + p : '—'; }
  return { model, pages };
}
/* Links in page-box coordinates (origin top-left), from the laid-out DOM. */
function reportLinksOf(host, pages) {
  const links = [];
  const secRect = pages.map(s => s.getBoundingClientRect());
  for (const a of host.querySelectorAll('a[href^="#"]')) {
    const sec = a.closest('.rp-page'), id = a.getAttribute('href').slice(1), tgt = host.querySelector('#' + CSS.escape(id));
    if (!sec || !tgt) continue;
    const pi = pages.indexOf(sec), r = a.getBoundingClientRect(), ts = tgt.closest('.rp-page') || tgt, ti = pages.indexOf(ts);
    if (ti < 0 || r.width <= 0 || r.height <= 0) continue;
    const o = secRect[pi], to = secRect[ti];
    const q = v => Math.round(v * 10) / 10;
    links.push({ page: pi + 1, rect: [q(r.left - o.left), q(r.top - o.top), q(r.width), q(r.height)], targetPage: ti + 1, targetY: tgt === ts ? 0 : q(Math.max(0, tgt.getBoundingClientRect().top - to.top - 6)) });
  }
  return { pages: pages.length, pageSize: [RP_W, RP_H], links };
}
/* Lay the report out off screen, then hand back what the caller needs (the host is removed afterwards). */
function withReport(fn) {
  const host = document.createElement('div');
  host.className = 'rp rp-host';
  document.body.append(host);
  try { const r = buildReport(st.doc, st.geo, host, viewedVisit()); return fn(host, r); }
  finally { host.remove(); }
}
function reportDocument(host, brand, title) {

  const body = host.innerHTML.replace(/ style="[^"]*"/g, '');
  return `<!DOCTYPE html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=595"><title>${esc(title)} · ${esc(st.doc.address || '')}</title>` +
    `<style>@page{size:595px 842px;margin:0}html,body{margin:0;padding:0;background:#fff}.rp{--acc:${brand.accent}}${css}${extra}</style></head><body class="rp">${body}</body></html>`;
}
function reportHTML() { return withReport((host, r) => reportDocument(host, r.model.brand, r.model.rep.title)); }
function reportLinks() { return withReport((host, r) => reportLinksOf(host, r.pages)); }

/* ---- Report view (on-screen preview of the real pages) ---- */

/* Report details: markup.report and markup.brand. The brand is also remembered on this device for new jobs. */

  drawSw();
  const L = t => el('div', { class: 'sh-label', text: t });
  openSheet('Report details', 'Printed on the assessment report', [
    L('Report type'), typeCh, L('Title'), title, L('Claim / job ref'), claim, L('Prepared by'), by, L('Prepared for'), forr,
    L('Summary'), summary, L('Recommendations'), recs,
    el('div', { class: 'note', text: 'Leave these empty to leave them out. The report never writes them for you.' }),
    L('Include'), ...boxes.map(b => b[2]),

        summary: summary.value.trim(), recommendations: recs.value.trim(),

}
/* Logos: PNG (keeps transparency), at most 900 x 300 px. */
function pickLogo(cb) {
  const inp = $('file-logo');
  inp.value = '';
  inp.onchange = () => {
    const file = inp.files && inp.files[0]; if (!file) return;
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 900 / img.naturalWidth, 300 / img.naturalHeight);
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); cb(c.toDataURL('image/png'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); toast('Could not read that image'); };
    img.src = url;
  };
  inp.click();
}
/* Export: hosted -> the app makes the PDF (one page per box, links from reportLinks); browser -> print the

  reportHTML() { return st.doc ? reportHTML() : null; },
  reportLinks() { return st.doc ? reportLinks() : null; },
  /* Host: import a Polycam .glb (base64). Loads it (empty markup), saves, returns the importer's summary. */
  importGLB(base64) {
    const bin = atob(String(base64).replace(/^data:[^,]*,/, '')), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const opts = st.doc ? { address: st.doc.address || '', jobRef: st.doc.jobRef || '' } : {};
    let res;
    try { res = window.SecureScanGLB.convert(bytes.buffer, opts); }
    catch (e) { showMessage('Could not import that model', e.message); throw e; }
    loadDoc(res.plan); flushSave(true);
    return res.summary;
  },
  /* Test/debug helpers: map plan metres to page coordinates and inspect state. */
  debug: {
    planToClient(p) {
      const sh = st.view === 'plan' ? st.plan : null; if (!sh) return null;
      const q = sh.S(p), c = st.cam.plan, r = stage.getBoundingClientRect();
      return [r.left + c.tx + q[0] * c.s, r.top + c.ty + q[1] * c.s];
    },
    sheetToClient(q) { const c = st.cam[st.view], r = stage.getBoundingClientRect(); return [r.left + c.tx + q[0] * c.s, r.top + c.ty + q[1] * c.s]; },
    state() { return { view: st.view, tool: st.tool, etool: st.etool, focusWall: st.focusWall, pickWall: st.pickWall, undo: st.undo.length, markup: st.markup, layers: { ...st.layers }, cam: { ...st.cam[st.view] } }; },
    hits() { const sh = currentSheet(); return sh ? sh.hits : []; },
    sheetSize() { const sh = currentSheet(); return sh ? [sh.W, sh.H] : null; },
    scopeSheetHTML() { return buildScopeSheet(vdoc(), st.geo); },
    elevationSVG() { const D = vdoc(), e = elevationList(st.geo, D, new Map()); const s = renderElevationSheet(D, st.geo, e); return svgDoc(s.body, s.W, s.H); },
    planSVG(markup) { const s = renderPlan(vdoc(), st.geo, { markup, layers: ALL_LAYERS }); return svgDoc(s.body, s.W, s.H); },
    async packFiles(mode) {
      const files = await buildPack(mode, () => {});
      return files.map(f => ({ filename: f.filename, mime: f.mime, base64: f.base64 || bytesBase64(f.bytes) }));
    },
    viewVisit(id) { st.viewVisit = id || null; render(); return viewedVisit(); },
    elevBlocks() { return (st.elev && st.elev.blocks || []).map(b => ({ letter: b.e.letter, wallId: b.e.w.id, y: b.y, face: b.face })); },
    /* v1.7 drawings for tests: the SVG and the geometry it was drawn with */
    roomNet(roomId, variant, W, H) { const room = st.geo.rooms.find(r => r.id === roomId); if (!room) return null; const n = renderRoomNet(vdoc(), st.geo, room, { variant, W, H }); return { svg: svgDoc(n.body, n.W, n.H), W: n.W, H: n.H, info: n.info }; },
    netRooms(works) { return netRooms(vdoc(), st.geo, !!works).map(r => r.id); },
    cut(o) { const room = o.room ? st.geo.rooms.find(r => r.id === o.room) : null; const item = o.item ? [...vdoc().markup.readings, ...vdoc().markup.sources].find(x => x.id === o.item) : null; const r = renderCut(vdoc(), st.geo, { ...o, room, item }); return { svg: svgDoc(r.body, r.W, r.H), W: r.W, H: r.H, info: r.info }; },
    floorQty(id) { const x = vdoc().markup.removals.find(y => y.id === id); if (!x) return null; const q = floorRemovalQty(vdoc(), st.geo, x); return { m2: q.m2, type: q.type, room: q.room ? roomName(q.room) : null, skirtingLm: q.skirtingLm, thresholdLm: q.thresholdLm }; },
    scopeAuto() { return autoScope(st.doc, st.geo); },
    photoNames() { return [...photoFiles(st.doc).values()]; },
    cutViews(roomId) { const room = st.geo.rooms.find(r => r.id === roomId); return room ? cutViews(vdoc(), st.geo, room).views : null; },
    roomOf(id) { const d = vdoc(), x = [...d.markup.readings, ...d.markup.sources, ...d.markup.removals].find(y => y.id === id); const r = x && readingRoom(st.geo, d, x, new Map()); return r ? roomName(r) : null; }
  }
};

if (HOST) {
  $('btn-done').hidden = false; $('btn-open').hidden = true;
  const em = $('empty'); em.textContent = 'Loading plan…'; em.hidden = false;
  updateChrome();
  post({ type: 'ready' });
} else {
  let doc = null;
  try { const s = localStorage.getItem(STORAGE_KEY); if (s) doc = JSON.parse(s); } catch (e) { doc = null; }
  loadDoc(doc || sampleDoc());
}
})();
</script>
</body>
