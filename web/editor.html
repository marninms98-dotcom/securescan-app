<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>SecureScan plan</title>
<style>
:root {
  --bar: #15171c; --bar2: #262a33; --line: #343945; --stage: #cfcec9;
  --ink: #1f2330; --muted: #6b7080; --accent: #2563eb; --kb: 0px;
  --font: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bar);
  font-family: var(--font); -webkit-text-size-adjust: 100%; color: var(--ink); }
body { position: fixed; inset: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
button { font-family: inherit; touch-action: manipulation; cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
#app { position: absolute; inset: 0; display: flex; flex-direction: column; }

/* top bar */
#topbar { display: flex; align-items: center; gap: 6px; background: var(--bar); color: #fff;
  padding: calc(env(safe-area-inset-top, 0px) + 6px) calc(env(safe-area-inset-right, 0px) + 8px) 6px calc(env(safe-area-inset-left, 0px) + 8px); }
.tb-btn { min-width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--bar2); color: #fff;
  font-size: 15px; font-weight: 600; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: none; }
.tb-btn.icon { padding: 0; width: 44px; }
.tb-btn svg { width: 22px; height: 22px; }
.tb-btn.primary { background: var(--accent); }
.spacer { flex: 1; min-width: 0; }
.tb-label { color: #fff; font-size: 16px; font-weight: 700; padding: 0 4px; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 44px; height: 44px; border-radius: 22px; border: 3px solid #fff; box-shadow: 0 0 0 1px #cfd3dc; }
.swatch.on { box-shadow: 0 0 0 2.5px var(--ink); }
.logo-prev { width: auto !important; max-width: 140px; height: 48px !important; object-fit: contain !important; border: 1px solid #e1e4ea; background: #fff; padding: 4px; }
.seg { display: inline-flex; background: var(--bar2); border-radius: 12px; padding: 0; flex: 0 1 auto; min-width: 0; }
.seg button { height: 44px; min-width: 44px; border: 0; border-radius: 12px; background: transparent; color: #b8bdcb; font-size: 14px; font-weight: 600; padding: 0 11px; white-space: nowrap; }
.seg button.on { background: #fff; color: var(--ink); }

/* stage */
#stage { position: relative; flex: 1; min-height: 0; background: var(--stage); overflow: hidden; touch-action: none; }
#svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #4b4f5c; font-size: 17px; pointer-events: none; }
/* the hint sits at the top of the stage (the legend and the action bar live at the bottom) and fades after a few seconds */
#hint { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); max-width: calc(100% - 20px);
  background: rgba(21, 23, 28, .86); color: #fff; font-size: 14px; line-height: 1.25; padding: 8px 14px; border-radius: 18px;
  width: max-content; text-align: center; pointer-events: none; transition: opacity .35s; }
#hint.fade { opacity: 0; }
#stage.has-chip #hint { top: 60px; }
#visit-chip { position: absolute; left: 8px; top: 8px; min-height: 44px; max-width: calc(100% - 16px); padding: 0 14px 0 12px; border: 0; border-radius: 22px;
  background: rgba(21, 23, 28, .86); color: #fff; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#visit-chip .dot { width: 8px; height: 8px; border-radius: 4px; background: #5ec27f; flex: none; }
#visit-chip small { font-weight: 500; color: #c9cdd8; font-size: 13px; }
#visit-chip.past { left: 0; right: 0; top: 0; max-width: none; border-radius: 0; background: #fbf0d9; color: #5c3d00; justify-content: space-between; padding: 0 6px 0 14px; }
#visit-chip.past .dot { background: #c98a0b; }
#visit-chip.past b { background: #fff; color: var(--ink); border-radius: 18px; padding: 6px 12px; font-size: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.vrow { display: flex; align-items: center; gap: 12px; }
.vrow .tag { font-size: 12px; font-weight: 700; color: #1f6b41; background: #e5f2ea; border-radius: 10px; padding: 2px 8px; }
.vrow .tag.view { color: #5c3d00; background: #fbf0d9; }
input[type=date] { font-family: inherit; font-size: 17px; width: 100%; min-height: 46px; border: 1px solid #cfd3dc; border-radius: 12px; padding: 0 12px; color: var(--ink); background: #fff; }
/* re-measure */
.rm-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.rm-prog { font-size: 14px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.rm-bar { height: 5px; border-radius: 3px; background: #e8eaf0; overflow: hidden; margin: 6px 0 10px; }
.rm-bar i { display: block; height: 100%; background: var(--accent); }
.rm-where { font-size: 16px; line-height: 1.35; font-weight: 600; margin: 0 0 10px; }
.rm-media { display: flex; gap: 10px; align-items: stretch; margin-bottom: 10px; }
.rm-media img { height: 118px; max-width: 58%; object-fit: cover; border-radius: 10px; border: 1px solid #e1e4ea; }
.rm-media svg { flex: 1; min-width: 0; height: 118px; border-radius: 10px; border: 1px solid #e1e4ea; background: #fff; }
.rm-cap { font-size: 12px; color: var(--muted); margin: -6px 0 10px; }
.rm-prev { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.rm-prev .pill { min-width: 0; font-size: 14px; }
.rm-val { display: flex; align-items: center; gap: 10px; }
.rm-val input[type=text] { font-size: 42px; font-weight: 700; min-height: 72px; width: 100%; text-align: center; letter-spacing: -.01em; }
.rm-val .unit { font-size: 30px; font-weight: 700; color: var(--muted); }
.rm-acts { display: flex; gap: 10px; margin-top: 12px; }
.rm-acts .btn { flex: none; }
.rm-acts .btn.primary { flex: 1; font-size: 19px; min-height: 58px; }
.rm-acts .btn.plain { min-height: 58px; }
.rm-links { display: flex; justify-content: space-between; margin-top: 6px; }
.rm-links button { background: none; border: 0; color: var(--accent); font-size: 15px; font-weight: 600; min-height: 44px; padding: 0 4px; }
/* scope & quote */
.sc-line { border-top: 1px solid #eef0f3; padding: 10px 0; }
.sc-line.off { opacity: .5; }
.sc-top { display: flex; gap: 8px; align-items: center; }
.sc-top input[type=text] { flex: 1; min-width: 0; }
.sc-top input[type=checkbox] { width: 26px; height: 26px; flex: none; accent-color: var(--accent); }
.sc-nums { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.sc-nums label { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
.sc-nums input { width: 64px !important; text-align: right; }
.sc-amt { margin-left: auto; font-size: 15px; font-weight: 700; white-space: nowrap; }
.sc-edit { font-size: 12px; color: #8a5a00; background: #fbf0d9; border-radius: 8px; padding: 2px 6px; }
.sc-reset, .sc-del { background: none; border: 0; color: var(--accent); font-size: 14px; font-weight: 600; min-height: 44px; padding: 0 6px; }
.sc-del { color: #b42318; }
.sc-tot { border-top: 1.5px solid var(--ink); margin-top: 8px; padding-top: 8px; font-size: 15px; }
.sc-tot div { display: flex; justify-content: space-between; padding: 3px 0; }
.sc-tot div:last-child { font-weight: 700; font-size: 17px; }
#actionbar { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; gap: 8px; padding: 0 10px; pointer-events: none; }
#actionbar button { pointer-events: auto; min-height: 44px; min-width: 44px; padding: 0 16px; border-radius: 22px; border: 0; font-size: 15px; font-weight: 600;
  background: #fff; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.18); flex: none; }
#actionbar button.primary { background: var(--accent); color: #fff; }
#actionbar button.on { background: var(--ink); color: #fff; }
#actionbar.nav { justify-content: flex-start; overflow-x: auto; pointer-events: auto; touch-action: pan-x; scrollbar-width: none; padding: 4px 10px; }
#actionbar.nav::-webkit-scrollbar { display: none; }
#actionbar.nav button { padding: 0 14px; }
#actionbar.nav .nav-spacer { flex: 1 0 0; }

/* toolbar */
#toolbar { display: flex; justify-content: space-around; gap: 4px; background: var(--bar);
  padding: 6px calc(env(safe-area-inset-right, 0px) + 6px) calc(env(safe-area-inset-bottom, 0px) + 6px) calc(env(safe-area-inset-left, 0px) + 6px); }
.tool { flex: 1; max-width: 104px; min-height: 58px; border: 0; border-radius: 14px; background: transparent; color: #a9aebd;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; }
.tool svg { width: 26px; height: 26px; }
.tool.on { background: var(--bar2); color: #fff; }
.tool.wide { max-width: 220px; flex-direction: row; gap: 8px; font-size: 16px; }
.tool.wide svg { width: 22px; height: 22px; }
@media (max-height: 760px) { .tool { min-height: 50px; gap: 2px; } #toolbar { padding-top: 4px; } }
@media (max-width: 479px) {
  #topbar { gap: 4px; }
  .seg button { padding: 0 9px; }
  #btn-done, #btn-open { padding: 0 10px; }
  #btn-export { width: 44px; padding: 0; }
  #btn-export .lbl { display: none; }
}
@media (min-width: 480px) { #btn-export svg { display: none; } }

/* notes timeline */
#notesview { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; background: var(--stage); }
#notes-list { max-width: 640px; margin: 0 auto; padding: 10px 10px 24px; }
.tl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 4px 4px 8px; color: #3f4351; font-size: 13px; }
.tl-head b { font-size: 17px; color: var(--ink); }
.tl-day { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #4b4f5c; padding: 14px 6px 6px; }
.tl-card { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.tl-item { display: flex; align-items: flex-start; gap: 10px; width: 100%; min-height: 52px; padding: 10px 12px; border: 0; background: #fff; color: var(--ink);
  text-align: left; font-size: 16px; line-height: 1.38; border-top: 1px solid #eef0f3; -webkit-user-select: text; user-select: text; }
.tl-card > .tl-item:first-child { border-top: 0; }
.tl-item:active { background: #f3f5f9; }
.tl-time { flex: none; width: 60px; white-space: nowrap; font-size: 13px; font-weight: 600; color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
.tl-ico { flex: none; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; margin-top: -1px; }
.tl-ico svg { width: 26px; height: 26px; display: block; }
.tl-body { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.tl-note .tl-body { font-size: 16.5px; }
.tl-event .tl-body { font-size: 15px; color: #353946; }
.tl-event .tl-body b { color: var(--ink); }
.tl-meta { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.tl-empty-text { color: var(--muted); font-style: italic; }
.tl-thumb { flex: none; width: 52px; height: 52px; border-radius: 8px; object-fit: cover; border: 1px solid #e1e4ea; }
.tl-chev { flex: none; color: #b3b7c3; font-size: 20px; line-height: 1; padding-top: 2px; }
.tl-empty { background: #fff; border-radius: 14px; padding: 22px 18px; text-align: center; color: #4b4f5c; font-size: 15px; line-height: 1.45; }
textarea { font-family: inherit; font-size: 17px; line-height: 1.4; width: 100%; min-height: 120px; border: 1px solid #cfd3dc; border-radius: 12px; padding: 10px 12px;
  color: var(--ink); background: #fff; resize: vertical; -webkit-user-select: text; user-select: text; }
textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }

/* job pack progress */
#busy { position: fixed; inset: 0; background: rgba(10, 12, 16, .35); display: flex; align-items: center; justify-content: center; z-index: 5; }
.busy-card { width: min(320px, calc(100% - 40px)); background: #fff; border-radius: 16px; padding: 18px 18px 16px; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
.busy-title { font-size: 17px; font-weight: 700; margin-bottom: 10px; }
.busy-bar { height: 8px; border-radius: 4px; background: #e8eaf0; overflow: hidden; }
.busy-bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
.busy-sub { font-size: 13.5px; color: var(--muted); margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* sheets */
#backdrop { position: fixed; inset: 0; background: rgba(10, 12, 16, .28); }
#sheet { position: fixed; left: 0; right: 0; bottom: var(--kb); max-height: calc(100% - var(--kb) - 48px); overflow-y: auto;
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; background: #fff; border-radius: 18px 18px 0 0;
  box-shadow: 0 -6px 28px rgba(0,0,0,.22); padding: 6px 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
  -webkit-user-select: text; user-select: text; }
@media (min-width: 700px) { #sheet { left: 50%; right: auto; width: 540px; transform: translateX(-50%); } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: #d6d9e0; margin: 4px auto 8px; }
.sh-title { font-size: 19px; font-weight: 700; margin: 2px 0 2px; }
.sh-sub { font-size: 14px; color: var(--muted); margin: 0 0 10px; }
.sh-label { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 14px 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 0 15px; border-radius: 22px; border: 1px solid #d5d8e0; background: #f4f5f8; color: var(--ink); font-size: 15px; font-weight: 600; }
.kind-seg { margin: 4px 0 12px; flex-wrap: nowrap; }
.kind-seg .chip { flex: 1; min-height: 48px; }
.chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
input[type=text], input:not([type]) { font-family: inherit; font-size: 17px; width: 100%; min-height: 46px; border: 1px solid #cfd3dc; border-radius: 12px; padding: 0 12px; color: var(--ink); background: #fff; -webkit-user-select: text; user-select: text; }
input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.value-row { display: flex; align-items: center; gap: 10px; }
.value-row input { font-size: 36px; font-weight: 700; min-height: 64px; width: 100%; }
.value-row .unit { font-size: 28px; font-weight: 700; color: var(--muted); }
.pill { display: inline-block; min-width: 86px; text-align: center; font-size: 14px; font-weight: 700; padding: 7px 10px; border-radius: 16px; background: #eef0f4; color: var(--muted); }
.pill.dry { background: #e5f2ea; color: #1f6b41; } .pill.elevated { background: #fbf0d9; color: #8a5a00; }
.pill.wet { background: #fbe4e1; color: #a12a1c; } .pill.ref { background: #eceef2; color: #4b5060; }
.inline { display: flex; gap: 8px; align-items: center; }
.inline input { width: 120px; flex: none; }
.toggle { display: flex; align-items: center; justify-content: space-between; min-height: 48px; gap: 12px; font-size: 16px; border-bottom: 1px solid #eef0f3; }
.toggle input { width: 26px; height: 26px; accent-color: var(--accent); flex: none; }
.actions { display: flex; gap: 10px; margin-top: 18px; }
.btn { min-height: 50px; border-radius: 13px; border: 0; font-size: 17px; font-weight: 600; padding: 0 18px; }
.btn.primary { background: var(--accent); color: #fff; flex: 1; }
.btn.danger { background: #fdecec; color: #b42318; }
.btn.plain { background: #f1f2f5; color: var(--ink); }
.btn.block-done { flex: 1; }
.btn.block { width: 100%; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; text-align: left; padding: 10px 16px; margin-bottom: 8px; background: #f4f5f8; color: var(--ink); }
.btn.block small { font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 3px; }
.photo-row { display: flex; gap: 12px; align-items: center; }
.photo-row img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; border: 1px solid #e1e4ea; }
.note { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.35; }
#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 122px); transform: translateX(-50%); background: rgba(21,23,28,.92); color: #fff;
  font-size: 15px; padding: 10px 16px; border-radius: 14px; pointer-events: none; opacity: 0; transition: opacity .2s; max-width: 90%; text-align: center; }
#toast.show { opacity: 1; }
#sheet:not([hidden]) ~ #toast { top: calc(env(safe-area-inset-top, 0px) + 6px); }
[hidden] { display: none !important; }
#print-root { display: none; }
@media print {
  html, body { position: static; overflow: visible; height: auto; background: #fff; }
  #app, #backdrop, #sheet, #toast, #busy { display: none !important; }
  #print-root { display: block; }
}
</style>
<style id="print-css" media="print">
@page { size: A4 portrait; margin: 12mm 12mm 14mm; }
.ps { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 9.5pt; line-height: 1.35; color: #1f2330; background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.ps-head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1.5pt solid #5b5f7b; padding-bottom: 5pt; margin-bottom: 6pt; }
.ps-brand { font-size: 16pt; font-weight: 700; letter-spacing: .01em; }
.ps-doc { font-size: 11pt; font-weight: 600; color: #5b5f7b; }
.ps-meta { display: grid; grid-template-columns: repeat(4, auto); gap: 2pt 14pt; justify-content: start; font-size: 9pt; margin-bottom: 8pt; }
.ps-meta b { display: block; font-size: 7.5pt; text-transform: uppercase; letter-spacing: .05em; color: #6b7080; font-weight: 600; }
.ps h2 { font-size: 11.5pt; margin: 10pt 0 5pt; border-bottom: .5pt solid #c9ccd6; padding-bottom: 2pt; break-after: avoid; }
.ps-fig { break-inside: avoid; page-break-inside: avoid; margin: 0 0 6mm; }
.ps-fig svg { display: block; max-width: 100%; }
.ps-fig.plan svg { width: 100%; height: auto; max-height: 222mm; }
.ps-break { break-before: page; page-break-before: always; }
.ps table { width: 100%; border-collapse: collapse; font-size: 8.8pt; }
.ps th { text-align: left; font-size: 7.5pt; text-transform: uppercase; letter-spacing: .04em; color: #6b7080; font-weight: 600; border-bottom: .8pt solid #5b5f7b; padding: 3pt 4pt; }
.ps td { border-bottom: .5pt solid #dfe2e8; padding: 3.5pt 4pt; vertical-align: top; }
.ps tr { break-inside: avoid; page-break-inside: avoid; }
.ps td.num, .ps th.num { text-align: right; white-space: nowrap; }
.ps tfoot td { font-weight: 700; border-top: .8pt solid #5b5f7b; border-bottom: 0; }
.ps-dot { display: inline-block; width: 7pt; height: 7pt; border-radius: 50%; margin-right: 4pt; vertical-align: -.5pt; }
.ps-dot.dry { background: #2e7d4f; } .ps-dot.elevated { background: #c98a0b; } .ps-dot.wet { background: #c0392b; } .ps-dot.ref { background: #fff; border: 1.2pt solid #6b7280; width: 5pt; height: 5pt; }
.ps-thumb { width: 30mm; height: auto; border-radius: 1mm; display: block; }
.ps-note { font-size: 8.5pt; color: #4b5060; margin: 5pt 0 0; }
.ps-photos { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5mm; }
.ps-photos figure { margin: 0; break-inside: avoid; page-break-inside: avoid; }
.ps-photos img { width: 100%; height: auto; border-radius: 1mm; display: block; }
.ps-nophoto { height: 22mm; border: .6pt dashed #c3c6d2; border-radius: 1mm; display: flex; align-items: center; justify-content: center; color: #8a8f9c; font-size: 8.5pt; }
.ps-photos figcaption { font-size: 8.5pt; margin-top: 2pt; color: #4b5060; }
.ps-foot { margin-top: 8pt; font-size: 7.5pt; color: #8a8f9c; }
.ps td.nowrap { white-space: nowrap; width: 1%; }
.ps-tag { font-size: 7pt; text-transform: uppercase; letter-spacing: .05em; color: #6b7080; border: .5pt solid #c9ccd6; border-radius: 2pt; padding: 0 2pt; }
</style>
<style id="report-css">
/* Assessment report: fixed 595 x 842 px page boxes (1 px = 1 pt). Everything is scoped to .rp. */
.rp { --acc: #1f4e79; --ink: #222733; --sub: #4a5060; --mut: #7b8190; --rule: #d9dce3; --faint: #eef0f4;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--ink);
  -webkit-print-color-adjust: exact; print-color-adjust: exact; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
.rp-host { position: absolute; left: -20000px; top: 0; width: 595px; }
.rp-page { position: relative; width: 595px; height: 842px; overflow: hidden; background: #fff; box-sizing: border-box;
  font-size: 9.5px; line-height: 1.45; break-after: page; page-break-after: always; break-inside: avoid; }

<div id="app">

    </button>

  </header>

    tot.lm += L; tot.m2 += L * hM; removalTotals.set(x.item, tot);
    const rw = opt.pinsOnly ? 5 : 9;     // report plans: lighter, the X tag says what it is
    out.removals.push(`<g class="removal" data-id="${esc(x.id)}"><line x1="${f1(p0[0])}" y1="${f1(p0[1])}" x2="${f1(p1[0])}" y2="${f1(p1[1])}" stroke="#fff" stroke-width="${rw}"/><line x1="${f1(p0[0])}" y1="${f1(p0[1])}" x2="${f1(p1[0])}" y2="${f1(p1[1])}" stroke="${C.removal}" stroke-opacity="${opt.pinsOnly ? .75 : 1}" stroke-width="${rw}" stroke-dasharray="${opt.pinsOnly ? '7 5' : '11 6'}"/></g>`);
    hits.push({ kind: 'removal', id: x.id, seg: [p0, p1] });
  }

  // ---- dimensions ----
  if (layers.dims) for (const d of geo.dims) out.dims.push(dimensionSVG(d, S));

  // ---- readings: positions (fixed, they mark real places) ----
  const rPos = layoutReadings(readings, geo, side, S, PK);
  // report plans: pins that would still touch (across a corner, a floor pin by a wall) move apart, along their wall
  if (opt.pinsOnly) spreadPins(rPos.filter(p => !p.mark).map(p => Object.assign(p, { u: p.anchor ? unit(sub(S(geo.wallById.get(p.r.wallId).b), S(geo.wallById.get(p.r.wallId).a))) : null })), 22 * PK + 1.5);
  for (const p of rPos) placer.add(boxAt(p.c[0], p.c[1], (p.mark ? 9 : 24) * PK, (p.mark ? 9 : 24) * PK));

  // ---- sources and flow arrows ----
  const sources = mk && layers.sources ? m.sources.filter(s => isPt(s.pos)) : [];
  // a source on a wall line spreads into the room on the wall's markup side
  const flowOrigin = s => { const w = geo.wallById.get(s.wallId); return w ? add(s.pos, mul(w.n, side(w) * (HW + 0.12))) : s.pos; };
  let flowUsed = false;
  for (const a of affected) {
    let src = null, bestD = Infinity;
    for (const s of sources) { const o = flowOrigin(s); const dd = pointInPolygon(o, a.polygon) ? 0 : distToEdges(o, a.polygon); if (dd < bestD) { bestD = dd; src = s; } }
    if (!src || bestD > 3) continue;
    for (const path of flowPaths(flowOrigin(src), a.polygon, geo)) { out.flow.push(arrowSVG(path.map(S))); flowUsed = true; }
  }
  for (const s of sources) {
    const [x, y] = S(s.pos);
    out.sources.push(`<g class="source" data-id="${esc(s.id)}">${sourceGlyph(x, y, PK)}</g>`);
    placer.add(boxAt(x, y, 30 * PK, 30 * PK));
    hits.push({ kind: 'source', id: s.id, c: [x, y], r: 16 * PK });
  }

  // ---- elevation tags on plan ----
  for (const e of opt.noTags ? [] : elevs) {
    const w = e.w, into = mul(w.n, e.side);
    const cands = [];
    for (const off of [HW + 0.5, HW + 0.85, HW + 1.2]) for (const t of [0.5, 0.3, 0.7, 0.15, 0.85]) cands.push(S(add(lerp(w.a, w.b, t), mul(into, off))));
    for (const off of [HW + 0.45, HW + 0.8]) for (const t of [0.5, 0.25, 0.75]) cands.push(S(add(lerp(w.a, w.b, t), mul(into, -off))));     // else just outside the wall
    const c = placer.place(cands, p => boxAt(p[0], p[1], 30 * PK, 30 * PK));
    const mid = S(lerp(w.a, w.b, 0.5)), toWall = mul(into, dot(sub(c, mid), into) > 0 ? -1 : 1);     // the pointer turns to face its wall
    const apex = add(c, mul(toWall, 17 * PK)), b0 = add(c, mul(toWall, 9 * PK));
    const pp = perp(toWall);
    const tc = opt.pinsOnly ? '#9298a8' : C.ink, tt = opt.pinsOnly ? C.muted : C.ink;     // report plans: a light badge
    out.tags.push(`<g class="elev-tag" data-letter="${e.letter}"><path d="${pathD([apex, add(b0, mul(pp, 6.5 * PK)), sub(b0, mul(pp, 6.5 * PK))])}" fill="${tc}"/><circle cx="${f1(c[0])}" cy="${f1(c[1])}" r="${f1(11 * PK)}" fill="#fff" stroke="${tc}" stroke-width="${f1((opt.pinsOnly ? 1 : 1.6) * PK)}"/>${svgText(c[0], c[1] + 4.2 * PK, e.letter, { fs: 12 * PK, weight: opt.pinsOnly ? 600 : 700, anchor: 'middle', fill: tt })}</g>`);
    hits.push({ kind: 'elevTag', id: e.letter, c, r: 16 * PK });
  }

  // ---- equipment on site (drying) ----
  const equip = mk && layers.equipment !== false ? equipOf(m).filter(x => !x.removed || m._vid) : [];
  const equipCount = new Map();
  for (const x of equip) {
    const [ex, ey] = S(x.pos), t = equipType(x), w = 24 * PK, h = 17 * PK;
    equipCount.set(t, (equipCount.get(t) || 0) + 1);
    out.equip.push(`<g class="equip" data-id="${esc(x.id)}" data-type="${t}">${equipGlyph(ex, ey, t, PK * (opt.pinsOnly ? 0.8 : 1), x.dir, opt.equipLabels === false ? '' : x.label || '')}</g>`);
    placer.add(boxAt(ex, ey, w + 4, h + 4));
    hits.push({ kind: 'equip', id: x.id, c: [ex, ey], r: 13 * PK });
  }

  // ---- readings: leaders, circles, values ----
  const statusUsed = new Set(), trendUsed = new Set();
  const goal = goalOf(doc).value, vv = m._vid || null;
  let marksUsed = false, photosUsed = false, goalUsed = false, staleUsed = false, oldMarks = false;
  for (const p of rPos) {
    const r = p.r, st = statusOf(r, thr), col = st === 'none' ? C.ref : C[st] || C.ref, kind = kindOf(r);
    if (p.mark) {
      const old = vv && itemVisit(r) !== vv;      // a point of an earlier visit's moisture line
      if (old) oldMarks = true;
      out.readings.push(`<path class="tape-mark${old ? ' old' : ''}" data-id="${esc(r.id)}" d="${pathD(rectPoly(p.c, 7.5 * PK, 7.5 * PK, p.d))}" fill="${C.tape}" stroke="#fff" stroke-width=".8"${old ? ' opacity=".35"' : ''}/>`);
      hits.push({ kind: 'reading', id: r.id, c: p.c, r: 6 * PK });
      marksUsed = true;
      if (refs.has(r.id)) {
        const lab = refs.get(r.id), lw = textW(lab, 10 * PK, true) + 4;
        const c = placer.place([[1, 0], [-1, 0], [0, -1], [0, 1]].map(dv => [p.c[0] + dv[0] * (8 * PK + lw / 2), p.c[1] + dv[1] * 12 * PK]), q => boxAt(q[0], q[1], lw, 13 * PK));
        out.labels.push(svgText(c[0], c[1] + 3.6 * PK, lab, { fs: 10 * PK, weight: 700, anchor: 'middle', fill: C.tapeDark, halo: true, attrs: `class="mark-ref" data-id="${esc(r.id)}"` }));
      }
      continue;
    }
    let g = '';
    if (p.anchor) {
      const dir = unit(sub(p.c, p.anchor)), e = sub(p.c, mul(dir, 11 * PK));
      g += `<line x1="${f1(p.anchor[0])}" y1="${f1(p.anchor[1])}" x2="${f1(e[0])}" y2="${f1(e[1])}" stroke="${C.muted}" stroke-width=".9"/><circle cx="${f1(p.anchor[0])}" cy="${f1(p.anchor[1])}" r="2.4" fill="${C.ink}"/>`;
    }
    if (kind === 'photo') {
      photosUsed = true;
      out.readings.push(`<g class="photo-note" data-id="${esc(r.id)}" data-n="${r.n}">${g}${PK === 1 ? cameraGlyph(p.c[0], p.c[1]) : `<g transform="translate(${f1(p.c[0])} ${f1(p.c[1])}) scale(${PK})">${cameraGlyph(0, 0)}</g>`}</g>`);
      hits.push({ kind: 'reading', id: r.id, c: p.c, r: 13 * PK });
      const lab = 'P' + r.n, lw = textW(lab, 11.5 * PK, true) + 4, into = p.into || [1, 0];
      const cands = [];
      for (const f of [1, 1.6]) for (const dv of [into, [1, 0], [-1, 0], [0, 1], [0, -1], [0.7, 0.7], [-0.7, 0.7], [0.7, -0.7], [-0.7, -0.7]]) cands.push([p.c[0] + Math.sign(Math.round(dv[0] * 2) / 2) * (14 * PK + lw / 2) * f * (Math.abs(dv[0]) > 0.3 ? 1 : 0), p.c[1] + Math.sign(Math.round(dv[1] * 2) / 2) * 19 * PK * f * (Math.abs(dv[1]) > 0.3 ? 1 : 0)]);
      const c = placer.place(cands, q => boxAt(q[0], q[1], lw, 15 * PK));
      out.labels.push(svgText(c[0], c[1] + 4 * PK, lab, { fs: 11.5 * PK, weight: 700, anchor: 'middle', fill: C.refText, halo: true, attrs: `class="photo-label" data-id="${esc(r.id)}"` }));
      continue;
    }
    statusUsed.add(st);
    const stale = r._measured === false, trend = trendOf(r);
    if (stale) staleUsed = true;
    const num = r.n + (st === 'ref' ? 'R' : '');
    if (st === 'ref') g += `<circle cx="${f1(p.c[0])}" cy="${f1(p.c[1])}" r="${f1(11 * PK)}" fill="#fff" stroke="${C.ref}" stroke-width="${f1(2.2 * Math.min(PK, 1.4))}"/>` + svgText(p.c[0], p.c[1] + 3.8 * PK, num, { fs: (num.length > 2 ? 9 : 10.5) * PK, weight: 700, anchor: 'middle', fill: C.refText });
    else g += `<circle cx="${f1(p.c[0])}" cy="${f1(p.c[1])}" r="${f1(11 * PK)}" fill="${col}" stroke="#fff" stroke-width="1.2"/>` + svgText(p.c[0], p.c[1] + 4 * PK, num, { fs: (num.length > 1 ? 10 : 11.5) * PK, weight: 700, anchor: 'middle', fill: '#fff' });
    // trend since the previous visit (top right) and a tick at or below the drying goal (bottom right)
    if (trend) {
      trendUsed.add(trend);
      g += trendGlyph(p.c[0] + 11 * PK, p.c[1] - 10 * PK, trend, PK);
    }
    if (!stale && st !== 'ref' && st !== 'none' && vv && isNum(r.value) && r.value <= goal) { goalUsed = true; g += goalTick(p.c[0] + 10 * PK, p.c[1] + 9 * PK, PK); }
    out.readings.push(`<g class="reading${stale ? ' stale' : ''}" data-id="${esc(r.id)}" data-n="${r.n}" data-status="${st}"${trend ? ` data-trend="${trend}"` : ''}${stale ? ' opacity=".42"' : ''}>${g}</g>`);
    hits.push({ kind: 'reading', id: r.id, c: p.c, r: 14 * PK });
    if (opt.pinsOnly) continue;
    // value label: on the room side of the circle, else wherever it fits
    const val = fmtVal(r.value), vw = textW(val, 11.5, true) + 4;
    const tc = st === 'none' ? C.refText : C[st + 'Text'];
    const into = p.into || [1, 0];
    const cands = [into, [1, 0], [-1, 0], [0, 1], [0, -1]].map(dv => {
      const horiz = Math.abs(dv[0]) > 0.7;
      const cx = p.c[0] + (horiz ? Math.sign(dv[0]) * (13 + vw / 2) : 0), cy = p.c[1] + (horiz ? 0 : Math.sign(dv[1]) * 20);
      return [cx, cy];
    });
    const c = placer.place(cands, q => boxAt(q[0], q[1], vw, 15));
    out.labels.push(svgText(c[0], c[1] + 4, val, { fs: 11.5, weight: 700, anchor: 'middle', fill: tc, halo: true, attrs: `class="reading-value" data-id="${esc(r.id)}"` }));
  }

  // ---- source labels ----
  for (const s of sources) {
    const [x, y] = S(s.pos), txt = opt.pinsOnly && refs.has(s.id) ? refs.get(s.id) : (refs.has(s.id) ? refs.get(s.id) + ' · ' : '') + (s.label || 'Water source'), FS = 12 * PK, LH = 15 * PK;
    const lines = textW(txt, FS, true) > 130 * PK ? wrapText(txt, 120 * PK, FS * 1.08) : [txt];
    const w = Math.max(...lines.map(l => textW(l, FS, true))) + 6, h = lines.length * LH + 2;
    const cands = [];
    for (const r of [22, 34, 48]) for (let i = 0; i < 12; i++) {
      const a = i * Math.PI / 6, ux = Math.cos(a), uy = Math.sin(a);
      cands.push([x + ux * (r * PK + w / 2 * Math.abs(ux)), y + uy * (r * PK + h / 2 * Math.abs(uy))]);
    }
    const c = placer.place(cands, q => boxAt(q[0], q[1], w, h));
    lines.forEach((l, i) => out.labels.push(svgText(c[0], c[1] + 4.3 * PK + (i - (lines.length - 1) / 2) * LH, l, { fs: FS, weight: 600, anchor: 'middle', fill: C.waterDark, halo: true, attrs: 'class="source-label"' })));
  }

  // ---- room labels ----
  for (const r of geo.rooms) {
    const name = roomName(r), area = fmtArea(r.area);
    const w = Math.max(textW(name, 15 * LK), textW(area, 12.5 * LK)) + 8, h = 38 * LK;
    const cands = candidatesIn(r.poly, r.lp, 0.2, 1.6).map(S);
    if (!cands.length) cands.push(S(r.lp));
    // report plans: a crowded room keeps its name and drops the area (the room page has it)
    const { v, c } = placer.placeAny([{ two: true, cands, make: p => boxAt(p[0], p[1], w, h) }, ...(opt.pinsOnly ? [{ two: false, cands, make: p => boxAt(p[0], p[1], textW(name, 15 * LK) + 8, 18 * LK) }] : [])]);
    const dy = v.two ? -2 * LK : 5 * LK;
    out.labels.push(`<g class="room-label" data-id="${esc(r.id)}" data-area="${r.area.toFixed(2)}">${svgText(c[0], c[1] + dy, name, { fs: 15 * LK, weight: 500, anchor: 'middle', halo: true, haloW: (mk ? 3.2 : 2.4) * LK, fill: C.ink })}${v.two ? svgText(c[0], c[1] + 14 * LK, area, { fs: 12.5 * LK, anchor: 'middle', halo: true, haloW: (mk ? 3.2 : 2.4) * LK, fill: '#3d4150' }) : ''}</g>`);
    hits.push({ kind: 'room', id: r.id, poly: boxAt(c[0], c[1], Math.max(w, 70), 44 * LK) });
  }

  // ---- affected labels (report plans: the legend carries the area) ----
  for (const a of opt.pinsOnly ? [] : affected) {
    const lp = labelPoint(a.polygon, 0.4), area = polygonArea(a.polygon);
    const head = a.label || 'Affected area';
    const cands = candidatesIn(a.polygon, lp, 0.15, 2.5).map(S);
    if (!cands.length) cands.push(S(lp));
    const variants = [[head + ' · ' + fmtArea(area)], [head, fmtArea(area)]].map(lines => {
      const w = Math.max(...lines.map(t => textW(t, 11.5))) + 6, h = lines.length * 14 + 2;
      return { lines, cands, make: p => boxAt(p[0], p[1], w, h) };
    });
    const { v, c } = placer.placeAny(variants);
    out.labels.push(`<g class="affected-label" data-area="${area.toFixed(2)}">` + v.lines.map((t, i) => svgText(c[0], c[1] + 4 + (i - (v.lines.length - 1) / 2) * 14, t, { fs: 11.5, italic: true, anchor: 'middle', fill: C.waterDark, halo: true })).join('') + '</g>');
  }

  // ---- removal tags: the reference (report plans) or what and how much ----
  removals.forEach(x => {
    const w = geo.wallById.get(x.wallId), into = mul(w.n, side(w));
    const t0 = Math.min(x.t0 ?? 0, x.t1 ?? 1), t1 = Math.max(x.t0 ?? 0, x.t1 ?? 1), tm = (t0 + t1) / 2;
    if (opt.remRefs && opt.remRefs.has(x.id)) {
      const ref = opt.remRefs.get(x.id), [tw, th] = tagSize(ref, 10.5 * PK), cands = [];
      for (const off of [HW + 0.22, HW + 0.45, HW + 0.75, HW + 1.05, HW + 1.4, -(HW + 0.3), -(HW + 0.6)]) for (const t of [tm, (t0 + tm) / 2, (tm + t1) / 2, t0 + (t1 - t0) * 0.12, t1 - (t1 - t0) * 0.12]) cands.push(S(add(lerp(w.a, w.b, t), mul(into, off))));     // near the wall first; further in, or just outside, when crowded
      const c = placer.place(cands, q => boxAt(q[0], q[1], tw + 3, th + 3));
      out.labels.push(tagSVG(c, ref, x.id, 10.5 * PK));
      hits.push({ kind: 'removal', id: x.id, poly: boxAt(c[0], c[1], tw, th) });
      return;
    }
    const L = (t1 - t0) * w.L, item = ITEMS[x.item] ? x.item : 'other';
    const l1 = 'Remove ' + ITEMS[item].label.toLowerCase();
    const hmm = Number(x.heightMm) || 0;
    const l2 = fmtM(L) + (item !== 'flooring' && hmm > 0 ? ' · ' + hmm + ' mm' : '');
    const TK = Math.min(PK, 1.35), RF = 10.5 * TK, bw = Math.max(textW(l1, RF, true), textW(l2, RF)) + 12, bh = 31 * TK;
    const cands = [];
    for (const sgn of [-1, 1]) for (const off of [0.42, 0.75, 1.1]) for (const t of [tm, (t0 + tm) / 2, (tm + t1) / 2]) cands.push(S(add(lerp(w.a, w.b, t), mul(into, sgn * (HW + off)))));
    const c = placer.place(cands, q => boxAt(q[0], q[1], bw, bh));
    const mid = S(lerp(w.a, w.b, clamp(projectT(sub(c, [ox, oy]).map(v => v / U), w.a, w.b), t0, t1)));
    const lead = dist(c, mid) > bh / 2 + 10 ? `<line x1="${f1(mid[0])}" y1="${f1(mid[1])}" x2="${f1(c[0])}" y2="${f1(c[1])}" stroke="${C.removal}" stroke-width="1"/>` : '';
    out.labels.unshift(`<g class="removal-tag" data-id="${esc(x.id)}">${lead}<rect x="${f1(c[0] - bw / 2)}" y="${f1(c[1] - bh / 2)}" width="${f1(bw)}" height="${f1(bh)}" rx="3" fill="#fff" stroke="${C.removal}" stroke-width="1.2"/>${svgText(c[0], c[1] - 2.5 * TK, l1, { fs: RF, weight: 700, anchor: 'middle', fill: C.removalDark })}${svgText(c[0], c[1] + 10.5 * TK, l2, { fs: RF, anchor: 'middle', fill: C.removalDark })}</g>`);
    hits.push({ kind: 'removal', id: x.id, poly: boxAt(c[0], c[1], bw, bh) });
  });

  // ---- legend ----
  const rows = [];
  if (mk) {
    if (sources.length) rows.push({ sym: 'source', text: sources.length > 1 ? 'Water sources' : 'Water source' });
    if (affected.length) rows.push({ sym: 'affected', text: 'Affected area · ' + fmtArea(affected.reduce((s, a) => s + polygonArea(a.polygon), 0)) });
    if (flowUsed) rows.push({ sym: 'flow', text: 'Direction of spread' });
    for (const [item, t] of removalTotals) rows.push({ sym: 'removal', text: `Remove ${(ITEMS[item] || ITEMS.other).label.toLowerCase()} · ${t.lm.toFixed(2)} lm` + (t.m2 > 0 ? ` · ${t.m2.toFixed(2)} m²` : '') });
    for (const t of fl.types) rows.push({ sym: 'floor:' + t, text: FLOOR_TYPES[t] + ' floor' });
    if (floorThresholdsOf(m).length) rows.push({ sym: 'threshold', text: 'Threshold (where floor finishes meet)' });
    if (layers.removals !== false && m.removals.some(isFloorRemoval)) rows.push(opt.pinsOnly ? { sym: 'cutline', text: 'Flooring to lift (tag: its reference)' } : { sym: 'floorcut', text: 'Flooring to lift (m²)' });
    if (wetUsed) rows.push({ sym: 'wetzone', text: 'Elevated / wet reading zone (indicative)' });
    if (statusUsed.has('dry')) rows.push({ sym: 'dry', text: `Dry reading (below ${thr.damp}%)` });
    if (statusUsed.has('elevated')) rows.push({ sym: 'elevated', text: `Elevated reading (${thr.damp}–${thr.wet}%)` });
    if (statusUsed.has('wet')) rows.push({ sym: 'wet', text: `Wet reading (${thr.wet}% and over)` });
    if (statusUsed.has('ref')) rows.push({ sym: 'ref', text: 'Reference (dry) reading' });
    if (trendUsed.has('down')) rows.push({ sym: 'trendDown', text: 'Lower than the previous visit (drying)' });
    if (trendUsed.has('level')) rows.push({ sym: 'trendLevel', text: 'Within 1 point of the previous visit' });
    if (trendUsed.has('up')) rows.push({ sym: 'trendUp', text: 'Higher than the previous visit (rising)' });
    if (goalUsed) rows.push({ sym: 'goal', text: `At or below the drying goal (${goalOf(doc).label})` });
    if (staleUsed) rows.push({ sym: 'stale', text: 'Not re-measured this visit (previous value, faded)' });
    for (const [t, n] of equipCount) rows.push({ sym: 'equip:' + t, text: `${EQUIP[t].label} (${EQUIP[t].code}) × ${n} on site` });
    if (marksUsed) rows.push({ sym: 'mark', text: oldMarks ? 'Moisture line point (earlier visits faded)' : 'Moisture line point' });
    if (photosUsed) rows.push({ sym: 'photo', text: 'Photo note' });
    if (elevs.length) rows.push({ sym: 'elev', text: `Wall elevation ${elevs.length > 1 ? elevs[0].letter + '–' + elevs[elevs.length - 1].letter : elevs[0].letter}` });
  }
  const notes = [];
  if (mk && readings.length) {
    if (m.meter) notes.push('Meter: ' + m.meter + '. Readings are comparative, as displayed by the meter.');
    notes.push(`Status colours use this job's thresholds (${thr.damp}% / ${thr.wet}%) as a display aid only; they are not an industry standard.`);
  }
  const scaleY = planBottom + 44;
  const legend = rows.length && !opt.bare ? legendSVG(rows, notes, 40, scaleY + 52, W - 80) : { svg: '', h: 0 };
  const H = Math.round(scaleY + 46 + (legend.h ? legend.h + 24 : 0));

  // ---- title block and scale bar ----
  const total = geo.rooms.reduce((s, r) => s + r.area, 0);
  const totalTxt = total >= 10 ? Math.round(total) : total.toFixed(1);
  const title = svgText(W / 2, 62, 'Floorplan', { fs: 34, weight: 600, anchor: 'middle' }) +
    svgText(W / 2, 96, doc.address || 'Tap to add the address', { fs: 20, anchor: 'middle', fill: doc.address ? C.ink : C.muted }) +
    (geo.rooms.length ? svgText(W / 2, 124, `Approximately ${totalTxt} m² total`, { fs: 16, anchor: 'middle' }) : '');
  hits.push({ kind: 'title', poly: boxAt(W / 2, 92, Math.max(textW(doc.address || 'Tap to add the address', 20) + 40, 260), 80) });
  const scale = `<g class="scale-bar"><rect x="40" y="${f1(scaleY)}" width="${U}" height="5" fill="#111"/>${svgText(40, scaleY + 25, '1 m', { fs: 15 })}</g>`;

  const defs = `<defs><pattern id="p-hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${C.water}" stroke-width="1.1" stroke-opacity=".45"/></pattern></defs>`;
  const body = defs + fl.defs + `<rect class="sheet-bg" x="0" y="0" width="${W}" height="${H}" fill="#fff"/>` + (opt.bare ? '' : title) +

  const when = ms => ms == null ? '—' : fmtDay(ms) + ', ' + fmtHMS(ms).slice(0, 5) + (oneOffset ? '' : ' (' + utcOffset(ms) + ')');
  const clock = ms => fmtHMS(ms) + (oneOffset ? '' : ' (' + utcOffset(ms) + ')');
  const wallRef = w => { const e = elevByWall.get(w.id); return 'wall ' + w.id + (e ? ' (Elevation ' + e.letter + ')' : ''); };
  const roomOf = x => { const r = readingRoom(geo, doc, x, memo); return r ? roomName(r) : null; };
  const along = (x, w) => { const e = elevByWall.get(w.id), t = clamp(isNum(x.wallT) ? x.wallT : projectT(x.pos, w.a, w.b), 0, 1), s = t * w.L; return e ? fmtM(e.flip ? w.L - s : s) + ' from the left end of Elevation ' + e.letter + ' as drawn' : null; };
  const how = x => x.source === 'ar' ? 'logged in the app during the scan' : x.source === 'manual' ? 'added by hand in the editor' : null;
  const place = x => {
    const w = geo.wallById.get(x.wallId), parts = [];
    const rm = roomOf(x); if (rm) parts.push(rm);
    if (w) { parts.push(wallRef(w)); if (isNum(x.height)) parts.push(mmLabel(x.height) + ' above floor'); }
    else if (isPt(x.pos)) parts.push('on the floor plan, not on a wall');
    return parts;
  };
  const quote = t => { const s = String(t || '').trim(); return s ? '“' + s.replace(/\r?\n/g, '\n  ') + '”' : '(not transcribed)'; };

  L.push('# Job summary: ' + (doc.address || 'address not recorded'), '');
  L.push('Everything below is taken from the SecureScan plan document for this job. Nothing has been added, estimated or inferred; anything not recorded is shown as "—" or "not recorded".', '');
  L.push('## Job', '');
  const timed = items.filter(i => i.t != null);
  const visit = timed.length ? (fmtYMD(timed[0].t) === fmtYMD(timed[timed.length - 1].t)
    ? when(timed[0].t) + ' to ' + fmtHMS(timed[timed.length - 1].t).slice(0, 5)
    : when(timed[0].t) + ' to ' + when(timed[timed.length - 1].t)) : null;
  L.push(table(['Field', 'Value'], [
    ['Address', doc.address || 'not recorded'],
    ['Job ref', doc.jobRef || 'not recorded'],
    ['Plan created', when(timeOf(doc.createdAt))],
    ['Plan last updated', when(timeOf(doc.updatedAt))],
    ['First to last time-stamped item', visit || 'no time-stamped items'],
    ['Moisture meter', m.meter || 'not recorded'],
    ['Reading status bands', `Dry below ${thr.damp}%; Elevated ${thr.damp}% to below ${thr.wet}%; Wet ${thr.wet}% and over. These are this job's display thresholds, not an industry standard.`],
    ...(multi ? [['Visits', `${visitsOf(doc).length} (visit ${visitById(doc, recVisit(doc)).n} is the latest recorded)`], ['Drying goal', `${goalOf(doc).label} — this job's display aid, not a standard`]] : []),
    ['Times', oneOffset ? `All times are local time, ${utcOffset(allT[0] ?? Date.now())}${zone ? ' (' + zone + ')' : ''}.` : `Local time${zone ? ' (' + zone + ')' : ''}; the UTC offset changes during this job, so it is given with each time.`]
  ]), '');

  if (multi) {
    L.push('## Visits', '');
    L.push(table(['No.', 'Type', 'Label', 'Date', 'By'], visitsOf(doc).map(v => [v.n, v.type, v.label || VISIT_TYPES[v.type], v.date ? fmtDate(v.date) : null, v.by || null])), '');
  }

  // rooms and walls
  const roomWalls = new Map(geo.rooms.map(r => [r.id, []])), loose = [];
  for (const w of geo.walls) {
    const inR = geo.rooms.filter(r => [0.25, 0.5, 0.75].some(t => [1, -1].some(sg => pointInPolygon(add(lerp(w.a, w.b, t), mul(w.n, sg * (HW + 0.15))), r.poly))));
    if (inR.length) inR.forEach(r => roomWalls.get(r.id).push(w)); else loose.push(w);
  }
  const rawWall = new Map(doc.walls.filter(w => w && w.id != null).map(w => [w.id, w]));
  const wallTxt = w => w.id + ' ' + fmtM(w.L) + (elevByWall.has(w.id) ? ' (Elevation ' + elevByWall.get(w.id).letter + ')' : '');
  const heights = ws => { const hs = [...new Set(ws.map(w => isNum(rawWall.get(w.id)?.height) ? fmtM(rawWall.get(w.id).height) : 'not recorded'))]; return hs.join(', '); };
  L.push('## Rooms', '');
  if (geo.rooms.length) {
    L.push(`Total floor area: ${geo.rooms.reduce((a, r) => a + r.area, 0).toFixed(2)} m² (${geo.rooms.length} room${geo.rooms.length > 1 ? 's' : ''}). Areas are from the scanned floor outlines.`, '');
    const rows = geo.rooms.map(r => [roomName(r), r.area.toFixed(2), heights(roomWalls.get(r.id)), roomWalls.get(r.id).map(wallTxt).join('; ')]);
    if (loose.length) rows.push(['(walls not bounding a scanned room)', '—', heights(loose), loose.map(wallTxt).join('; ')]);
    L.push(table(['Room', 'Floor area (m²)', 'Wall height', 'Walls (id, length)'], rows), '');
  } else L.push('No rooms recorded.', '');

  L.push('## Openings', '');
  if (geo.openings.length) {
    L.push(table(['Type', 'Wall', 'Room(s)', 'Width (m)', 'Height (m)', 'Sill (m)'], geo.openings.map(g => {
      const rooms = geo.rooms.filter(r => [1, -1].some(sg => pointInPolygon(add(lerp(g.w.a, g.w.b, (g.t0 + g.t1) / 2), mul(g.w.n, sg * (HW + 0.15))), r.poly))).map(roomName);
      return [g.o.type || 'opening', g.w.id, rooms.join(', '), ((g.t1 - g.t0) * g.w.L).toFixed(2), isNum(g.o.height) ? g.o.height.toFixed(2) : '—', isNum(g.o.sill) ? g.o.sill.toFixed(2) : '—'];
    })), '');
  } else L.push('No doors, windows or openings recorded.', '');

  const sources = m.sources.filter(x => isPt(x.pos));
  L.push('## Water source' + (sources.length === 1 ? '' : 's'), '');
  if (sources.length) {
    L.push(table(['No.', 'Source', 'Where', 'Position along the wall', 'Recorded', 'How', 'Photo'], m.sources.map((x, i) => isPt(x.pos) ? [i + 1, x.label || 'not labelled', place(x).join(' · '),
      geo.wallById.has(x.wallId) ? along(x, geo.wallById.get(x.wallId)) : null, when(timeOf(x.takenAt)), how(x), photos.get(x) || null] : null).filter(Boolean)), '');
  } else L.push('No water source marked.', '');

  const affected = m.affected.filter(a => Array.isArray(a.polygon) && a.polygon.length >= 3 && a.polygon.every(isPt));
  L.push('## Affected area' + (affected.length === 1 ? '' : 's'), '');
  if (affected.length) {
    const tot = affected.reduce((a, x) => a + polygonArea(x.polygon), 0);
    L.push(`Total marked affected area: ${tot.toFixed(2)} m² (as drawn on the plan).`, '');
    L.push(table(['Area', 'Label', 'Extent (m²)', 'Rooms it covers (approx. m² in each)'], affected.map((a, i) =>
      ['Area ' + (i + 1), a.label || '—', polygonArea(a.polygon).toFixed(2), affectedRooms(a, geo).map(([r, v]) => roomName(r) + ' ' + v.toFixed(1)).join(', ')])), '');
  } else L.push('No affected area marked.', '');

  // the timeline
  L.push('## Timeline', '', 'Spoken notes are quoted word for word as transcribed (and as corrected by hand where marked). Events are listed at the time they were recorded.', '');
  let day = null;
  for (const it of items) {
    const key = it.t == null ? 'none' : fmtYMD(it.t);
    if (key !== day) { L.push('### ' + (it.t == null ? 'No time recorded' : fmtDay(it.t)), ''); day = key; }
    const x = it.item, t = it.t == null ? '' : '`' + clock(it.t) + '` ';
    let line;
    if (it.type === 'note') {
      const extra = [];
      if (x.source !== 'typed' && typeof x.audio === 'string' && x.audio) extra.push('audio ' + x.audio + (isNum(x.audioOffset) ? ' from ' + Math.floor(x.audioOffset / 60) + ':' + pad2(Math.floor(x.audioOffset % 60)) : ''));
      if (x.edited) extra.push('text corrected by hand');
      line = `**${x.source === 'typed' ? 'Typed note' : 'Spoken note'}:** ${quote(x.text)}` + (extra.length ? ' _(' + extra.join('; ') + ')_' : '');
    } else if (it.type === 'source') {
      const w = geo.wallById.get(x.wallId);
      line = `**Water source ${it.n}:** ${x.label || 'not labelled'} · ` + [...place(x), w ? along(x, w) : null, how(x), photos.get(x) ? 'photo ' + photos.get(x) : null].filter(Boolean).join(' · ');
    } else if (it.type === 'reading' || it.type === 'remeasure') {
      const e = it.entry, val = e ? e.value : x.value, s0 = statusOf({ ...x, value: val }, thr), ph = photos.get(e || x), note = e ? e.note : x.note;
      const vis = e && multi ? ` (visit ${visitById(doc, e.visit || 'v1').n})` : '';
      line = `**${it.type === 'remeasure' ? 'Point ' + x.n + ' re-measured' : 'Reading ' + x.n}${vis}:** ${fmtVal(val)} · ${STATUS_LABEL[s0]}${x.reference ? ' (reference reading, unaffected area)' : ''} · ` +
        [...(it.type === 'remeasure' ? [] : place(x)), x.material && it.type !== 'remeasure' ? 'material: ' + x.material : null, note ? 'note: “' + note + '”' : null, it.type === 'remeasure' ? null : how(x), ph ? 'photo ' + ph : null].filter(Boolean).join(' · ');
    } else if (it.type === 'mark') {
      const w = geo.wallById.get(x.wallId);
      line = '**Moisture line point:** ' + [...place(x), w ? along(x, w) : null, x.note ? 'note: “' + x.note + '”' : null, how(x), photos.get(x) ? 'photo ' + photos.get(x) : null].filter(Boolean).join(' · ');
    } else {
      line = `**Photo P${x.n}:** ${x.note ? '“' + x.note + '”' : 'no caption'} · ` + [...place(x), photos.get(x) ? 'file ' + photos.get(x) : 'no image attached', how(x)].filter(Boolean).join(' · ');
    }
    L.push('- ' + t + line);
  }
  if (!items.length) L.push('Nothing time-stamped was recorded.');
  L.push('');

  const readings = m.readings.filter(r => kindOf(r) === 'reading').sort((a, b) => (a.n ?? 0) - (b.n ?? 0));
  L.push('## Moisture readings', '');
  if (readings.length) {
    L.push(table(['No.', 'Time', 'Room', 'Wall', 'Material', 'Height (mm)', 'Value (%)', 'Status', 'Reference', 'Note', 'Photo'], readings.map(r => {
      const w = geo.wallById.get(r.wallId);
      return [r.n, r.takenAt && timeOf(r.takenAt) != null ? clock(timeOf(r.takenAt)) : '—', roomOf(r), w ? wallRef(w) : 'floor / not on a wall', r.material, w && isNum(r.height) ? Math.round(r.height * 1000) : '—',
        isNum(r.value) ? r.value : '—', STATUS_LABEL[statusOf(r, thr)], r.reference ? 'yes' : 'no', r.note, photos.get(r) || null];
    })), '');
    L.push('Readings are as displayed by the meter' + (m.meter ? ' (' + m.meter + ')' : '') + ' and are comparative; reference readings are taken from unaffected areas of the same material.', '');
  } else L.push('No moisture readings recorded.', '');

  if (multi) {
    const dm = dryingModel(doc, recVisit(doc), geo), vs = dm.visits;
    L.push('## Drying progress', '', `The same points re-measured on each visit. Values in %, as displayed by the meter; "—" = not measured on that visit. Change = latest visit minus the previous one, in percentage points. Drying goal ${dm.goal.label} (a display aid, not a standard).`, '');
    L.push(table(['No.', 'Point', ...vs.map(v => `V${v.n} ${visitDayLabel(v)} (%)`), 'Change', 'At or below goal'], dm.points.map(p => [p.ref, p.where, ...vs.map(v => p.byVisit.has(v.id) ? p.byVisit.get(v.id) : '—'),
      p.measured && p.prev != null ? (p.value - p.prev > 0 ? '+' : '') + (Math.round((p.value - p.prev) * 10) / 10) : '—', p.reference ? 'reference' : p.atGoal ? 'yes' : p.measured ? 'no' : '—'])), '');
    if (dm.visit.type === 'final') L.push('Completion: ' + completionStatement(dm), '');
  }

  const eqAll = equipOf(m);
  if (eqAll.length) {
    const last = recVisit(doc);
    L.push('## Drying equipment', '');
    L.push(table(['Code', 'Type', 'Label', 'Room', 'Placed', 'Removed', 'Days on site'], eqAll.map(x => { const pv = visitById(doc, x.placed || 'v1'), rv = x.removed ? visitById(doc, x.removed) : null, room = roomAt(geo, x.pos);
      return [EQUIP[equipType(x)].code, EQUIP[equipType(x)].label, x.label || null, room ? roomName(room) : null, `visit ${pv.n}${pv.date ? ' (' + fmtDate(pv.date) + ')' : ''}`, rv ? `visit ${rv.n}${rv.date ? ' (' + fmtDate(rv.date) + ')' : ''}` : 'still on site', daysOnSite(doc, x, last)]; })), '');
  }

  const lines = elevs.filter(e => e.marks.length);
  L.push('## Moisture line', '');
  if (lines.length) {
    L.push('Points on the upper edge of the moisture, per wall. On the elevation drawings they are joined in order along the wall; the line is not extended beyond the outermost points.', '');
    for (const e of lines) {
      const pts = e.marks.map(r => ({ r, s: clamp(isNum(r.wallT) ? r.wallT : projectT(r.pos, e.w.a, e.w.b), 0, 1) * e.w.L })).map(p => ({ ...p, x: e.flip ? e.w.L - p.s : p.s })).sort((a, b) => a.x - b.x);
      const hs = pts.map(p => p.r.height);
      L.push(`### Elevation ${e.letter}: ${e.roomName}, wall ${e.w.id} (${fmtM(e.w.L)} long)`, '');
      L.push(`${pts.length} point${pts.length > 1 ? 's' : ''}; highest ${mmLabel(Math.max(...hs))}, lowest ${mmLabel(Math.min(...hs))} above floor.`, '');
      L.push(table(['Point', 'From the left end as drawn (m)', 'Height above floor (mm)', 'Recorded', 'How'], pts.map((p, i) => [i + 1, p.x.toFixed(2), Math.round(p.r.height * 1000), when(timeOf(p.r.takenAt)), how(p.r)])), '');
    }
  } else L.push('No moisture line marked.', '');

  const rems = m.removals.filter(x => geo.wallById.has(x.wallId));
  L.push('## Removal schedule', '');
  if (rems.length) {
    const totals = new Map(); let gl = 0, ga = 0;
    L.push(table(['Ref', 'Room', 'Wall', 'Item', 'Length (m)', 'Height (mm)', 'Area (m²)', 'Note'], rems.map((x, i) => {
      const w = geo.wallById.get(x.wallId), Lr = removalLen(x, w), hM = removalHeightM(x, w), item = ITEMS[x.item] ? x.item : 'other';
      const t = totals.get(item) || { lm: 0, m2: 0 }; t.lm += Lr; t.m2 += Lr * hM; totals.set(item, t); gl += Lr; ga += Lr * hM;
      const room = readingRoom(geo, doc, x, memo);
      return ['X' + (i + 1), room ? roomName(room) : null, wallRef(w), ITEMS[item].label, Lr.toFixed(2), hM > 0 ? Math.round(hM * 1000) : '—', (Lr * hM).toFixed(2), x.note];
    })), '');
    L.push('Totals:', '');
    L.push(table(['Item', 'Lineal metres', 'Area (m²)'], [...[...totals].map(([item, t]) => [ITEMS[item].label, t.lm.toFixed(2), t.m2.toFixed(2)]), ['All items', gl.toFixed(2), ga.toFixed(2)]]), '');
  } else L.push('No removals marked.', '');

  L.push('## Photos', '');
  const photoRows = [];
  for (const [key, f] of photos) {
    if (photos.removal.has(key)) {
      const x = photos.removal.get(key), w = geo.wallById.get(x.wallId), what = isFloorRemoval(x) ? FLOOR_TYPES[floorType(x.floorType)] + ' flooring' : (ITEMS[x.item] || ITEMS.other).label;
      photoRows.push([f, `${key.stage === 'after' ? 'After' : 'Before'} photo of removal ${m.removals.indexOf(x) + 1} (${what}${multiVisit(doc) ? ', visit ' + visitById(doc, key.visit || 'v1').n : ''})`, x.note || null, w ? (readingRoom(geo, doc, x, memo) ? roomName(readingRoom(geo, doc, x, memo)) : '') : (roomAt(geo, centroid(x.area)) ? roomName(roomAt(geo, centroid(x.area))) : ''), when(timeOf(key.takenAt))]);
      continue;
    }
    const item = photos.owner.get(key) || key, entry = photos.owner.has(key) ? key : null;
    const vis = entry && multi ? `, visit ${visitById(doc, entry.visit || 'v1').n}` : '';
    const k = m.sources.includes(item) ? 'Water source photo' : kindOf(item) === 'reading' ? `Photo of reading ${item.n} (meter${vis})` : kindOf(item) === 'photo' ? `Photo P${item.n}` : 'Moisture line point photo';
    photoRows.push([f, k, kindOf(item) === 'photo' && !m.sources.includes(item) ? item.note : m.sources.includes(item) ? item.label : null, place(item).join(' · '), when(timeOf((entry || item).takenAt))]);
  }
  const noImg = m.readings.filter(r => kindOf(r) === 'photo' && !photos.has(r));
  if (photoRows.length) L.push(table(['File', 'What', 'Caption', 'Where', 'Recorded'], photoRows), '');
  else L.push('No photos are embedded in the plan.', '');
  if (noImg.length) L.push('Photo notes without an image attached: ' + noImg.map(r => `P${r.n}${r.note ? ' (“' + r.note + '”)' : ''}`).join(', ') + '.', '');

  if (doc.markup.scope) {
    const sc = scopeOf(doc), sl = scopeLines(doc, geo).filter(l => l.include), t = scopeTotals(sl, sc.gst);
    L.push('## Scope of works', '');
    if (sl.length) {
      L.push(table(['No.', 'Item', 'Qty', 'Unit', 'Days', ...(t.priced ? ['Rate (AUD, ex GST)', 'Amount (AUD, ex GST)'] : [])], sl.map((l, i) => [i + 1, l.desc, fmtQty(l.qty), l.unit, l.days != null ? fmtQty(l.days) : null, ...(t.priced ? [l.rate != null ? money(l.rate) : 'not priced', l.amount != null ? money(l.amount) : null] : [])])), '');
      if (t.priced) L.push(`Subtotal ${money(t.sub)} ex GST; GST ${fmtQty(sc.gst * 100)}% ${money(t.gst)}; total ${money(t.total)} inc GST. Quote valid ${sc.validDays} days.${sc.terms ? ' Terms: ' + sc.terms : ''}`, '');
    } else L.push('No scope lines.', '');
  }

  L.push('## Files in this pack', '');
  const files = [['summary.md', 'this summary'], ['floor-plan.png', 'clean dimensioned floor plan'], ['marked-up-plan.png', 'floor plan with the water source, affected area, removals, readings, moisture line and legend']];
  if (elevs.length) files.push(['wall-elevations.png', `wall elevation${elevs.length > 1 ? 's' : ''} ${elevs.length > 1 ? elevs[0].letter + '–' + elevs[elevs.length - 1].letter : elevs[0].letter}: readings and moisture line at their heights, with removal extents`]);
  files.push(['schedule.csv', 'rooms, readings and removals as a spreadsheet'], ['moisture-scope-sheet.html', 'the A4 moisture & scope sheet (open in a browser and print to PDF)'],
    ['assessment-report.html', 'the assessment report as A4 pages (open in a browser and print to PDF)']);
  if (photos.size) files.push(['photos/', photos.size + ' photo' + (photos.size > 1 ? 's' : '') + ', named as listed above']);
  if (opts.mode === 'zip') files.push(['plan.json', 'the full plan document (open it in the SecureScan editor)']);
  for (const [f, d] of files) L.push(`- \`${f}\` — ${d}`);
  if (opts.mode === 'hosted') {
    const audio = [...new Set(notesOf(m).map(n => n.audio).filter(a => typeof a === 'string' && a))];
    L.push(`- Added by the SecureScan app: \`plan.json\` (the full plan document), the assessment report as a PDF${audio.length ? ', the recordings of the spoken notes (' + audio.map(a => '`' + a + '`').join(', ') + ')' : ''}, and \`model.usdz\` (3D model) when the job has one.`);
  }
  return L.join('\n') + '\n';
}

/* =========================================================================
   16. Assessment report: fixed A4 page boxes (595 x 842 px), laid out in the DOM so
       nothing overflows, with internal links (pins -> evidence cards -> back to the plan)
   ========================================================================= */
const RP_W = 595, RP_H = 842, RP_CW = 511, RP_BODY_H = 726;
const NET_RW = 640;
const BRAND_KEY = 'securescan.brand';
const ACCENTS = ['#1f4e79', '#2b3a55', '#1d5c4d', '#6d2e46', '#4a4458', '#7a5c1e'];
const BRAND_DEFAULT = { name: 'SecureWorks WA', tagline: '', accent: '#1f4e79', logo: '', contact: '' };
const REPORT_DEFAULT = { title: 'Water Damage Assessment', type: 'auto', preparedBy: '', preparedFor: '', claimRef: '', summary: '', recommendations: '',
  include: { isometric: true, unfoldedRooms: false, roomPages: true, notes: true, readingsTable: true, method: true } };
function rememberedBrand() { try { const b = JSON.parse(localStorage.getItem(BRAND_KEY) || 'null'); return b && typeof b === 'object' ? b : null; } catch (e) { return null; } }
function rememberBrand(b) { try { localStorage.setItem(BRAND_KEY, JSON.stringify(b)); } catch (e) { toast('Could not remember the logo on this device (storage full?)'); } }
/* The brand in use: the document's own, else the one remembered on this device (standalone), else the defaults. */
function brandOf(doc) {
  const b = doc.markup.brand && typeof doc.markup.brand === 'object' ? doc.markup.brand : (!HOST && rememberedBrand()) || {};
  const out = { ...BRAND_DEFAULT };
  for (const k of Object.keys(BRAND_DEFAULT)) if (typeof b[k] === 'string' && (b[k] || k === 'tagline' || k === 'contact' || k === 'logo')) out[k] = b[k];
  if (!/^#[0-9a-f]{6}$/i.test(out.accent)) out.accent = BRAND_DEFAULT.accent;
  if (!/^data:image\/(png|jpeg|jpg|webp|gif|svg\+xml);base64,/i.test(out.logo)) out.logo = '';
  return out;
}
function reportOf(doc) {
  const r = doc.markup.report && typeof doc.markup.report === 'object' ? doc.markup.report : {};
  const out = { ...REPORT_DEFAULT, include: { ...REPORT_DEFAULT.include } };
  for (const k of ['title', 'type', 'preparedBy', 'preparedFor', 'claimRef', 'summary', 'recommendations']) if (typeof r[k] === 'string') out[k] = r[k];
  if (!out.title.trim()) out.title = REPORT_DEFAULT.title;
  if (r.include && typeof r.include === 'object') for (const k of Object.keys(out.include)) if (typeof r.include[k] === 'boolean') out.include[k] = r.include[k];
  return out;
}
/* Pixel size of an embedded JPEG / PNG / GIF / WebP without decoding it. */
function imageSize(url) {

  if (!m) return null;
  let b;
  const head = m[2].length > 200000 ? m[2].slice(0, 200000) : m[2];      // the size is in the first few kB (after any EXIF)
  try { b = base64ToBytes(head); } catch (e) { return null; }
  const u16 = i => (b[i] << 8) | b[i + 1], u32 = i => ((b[i] << 24) | (b[i + 1] << 16) | (b[i + 2] << 8) | b[i + 3]) >>> 0;

  qLines.forEach((l, i) => { for (const id of l.refs || []) if (!qRef.has(id)) qRef.set(id, i + 1); });
  const remInfo = x => {
    if (isFloorRemoval(x)) { const q = floorRemovalQty(doc, geo, x); return { ref: remRefs.get(x.id), room: q.room, wall: null, what: `Lift ${FLOOR_TYPES[q.type].toLowerCase()}${x.underlay ? ' and underlay' : ''}`, size: `${q.m2.toFixed(2)} m²` }; }
    const w = geo.wallById.get(x.wallId), item = ITEMS[x.item] ? x.item : 'other', Lr = removalLen(x, w), hM = removalHeightM(x, w);
    return { ref: remRefs.get(x.id), room: readingRoom(geo, doc, x, model.memo), wall: model.elevByWall.get(w.id) || null, what: item === 'flooring' ? 'Lift flooring' : 'Remove ' + ITEMS[item].label.toLowerCase(),
      size: hM > 0 ? `${Lr.toFixed(2)} × ${hM.toFixed(2)} m = ${(Lr * hM).toFixed(2)} m²` : `${Lr.toFixed(2)} lm` };
  };
  const remsOf = room => m.removals.filter(x => remRefs.has(x.id) && remInfo(x).room === room);
  const tagHTML = id => `<a class="rp-tag" href="#x-${safeId(id)}">${esc(remRefs.get(id))}</a>`;
  const worksHTML = list => list.length ? `<ul class="rp-works">${list.map(x => { const r = remInfo(x); return `<li>${tagHTML(x.id)}<span>${esc(r.what)}${r.wall ? ', wall ' + r.wall.letter : ''} — ${esc(r.size)}${qRef.has(x.id) ? ` <span class="rp-cont">· quote line ${qRef.get(x.id)}</span>` : ''}${multi ? ` <span class="rp-cont">· ${x._done ? 'done' : 'proposed'}</span>` : ''}</span></li>`; }).join('')}</ul>` : '';
  /* transparent links over the removal tags of a cutaway, to the schedule row */
  const tagLinks = info => info.tags.map(t => { const [tw, th] = tagSize(t.ref); return `<a href="#x-${safeId(t.id)}" class="rp-tagl"><rect x="${f1(t.x - tw / 2)}" y="${f1(t.y - th / 2)}" width="${f1(tw)}" height="${f1(th)}" fill="#fff" fill-opacity="0"/></a>`; }).join('');
  /* the numbers in one room, by wall then height: number (to its card or table row), wall, height, value, page */
  const wallKey = it => it.elev ? 0 : it.w ? 1 : 2;
  const sortItems = list => list.slice().sort((a, b) => wallKey(a) - wallKey(b) || (a.elev && b.elev ? a.elev.letter.localeCompare(b.elev.letter) : 0) || (isNum(a.x.height) && a.w ? a.x.height : 0) - (isNum(b.x.height) && b.w ? b.x.height : 0) || a.ord - b.ord || (a.n ?? 0) - (b.n ?? 0));
  const pinTable = (list, ids) => `<table class="rp-mini"><thead><tr><th>No.</th><th>Wall</th><th class="n">Ht mm</th><th class="n">Value</th><th class="n">p.</th></tr></thead><tbody>` + sortItems(list).map((it, i, all) => {
    const x = it.x, go = it.target && it.target !== it.roomRowId ? it.target : null;
    const val = it.type === 'reading' ? (x._measured === false ? '—' : `<span class="rp-dot ${it.status}"></span>${fmtVal(x.value)}`) : `<span class="rp-cont">${it.type === 'source' ? 'source' : it.type === 'photo' ? 'photo' : 'line'}</span>`;
    const grp = i > 0 && (wallKey(it) !== wallKey(all[i - 1]) || (it.elev && all[i - 1].elev && it.elev !== all[i - 1].elev));     // a thin rule between walls
    return `<tr${ids && it.roomRowId ? ` id="${it.roomRowId}"` : ''}${grp ? ' class="grp"' : ''}><td class="rp-ref">${go ? `<a href="#${go}">${esc(it.ref)}</a>` : esc(it.ref)}</td><td>${it.elev ? it.elev.letter : it.w ? 'wall' : 'floor'}</td><td class="n">${it.w && isNum(x.height) ? Math.round(x.height * 1000) : '—'}</td><td class="n">${val}</td><td class="n">${go ? pref(go) : ''}</td></tr>`;
  }).join('') + '</tbody></table>';

  /* 1. cover */
  {
    const sec = page('cover');
    const meta = [['Claim / job ref', ref], multi ? ['Visit', `${visit.n} · ${visit.label || VISIT_TYPES[visit.type]}`] : null, [multi ? 'Visit date' : 'Inspection date', multi ? (visit.date ? fmtDate(visit.date) : '') : inspected != null ? fmtDay(inspected) : ''],
      ['Prepared by', rep.preparedBy], ['Prepared for', rep.preparedFor]].filter(x => x && x[1]);
    const keys = [];
    if (dm) {
      const c = dm.counts, hi = dm.main.filter(p => p.measured).sort((a, b) => b.value - a.value)[0];
      keys.push(['Since the last visit', `${c.down} lower`, `${c.level} within 1 point · ${c.up} higher`]);
      keys.push(['At or below the goal', `${c.atGoal} of ${c.measured}`, `Drying goal ${dm.goal.label}${c.measured < c.total ? ` · ${c.total - c.measured} not re-measured` : ''}`]);
      keys.push(['Highest this visit', hi ? fmtVal(hi.value) : '—', hi ? `Point ${hi.ref} · ${hi.where}` : '']);
      if (dm.days != null) keys.push(['Days since first visit', String(dm.days), `Visit ${visit.n} of ${visitsOf(baseDoc).length}`]);
    }
    else {
      if (sources.length) keys.push(['Water source', sources[0].x.label || 'Marked', [sources[0].room ? roomName(sources[0].room) : null, sources.length > 1 ? `+${sources.length - 1} more` : null].filter(Boolean).join(' · ')]);
      if (affected.length) keys.push(['Affected area', affTotal.toFixed(1) + ' m²', affRooms.size ? `${affRooms.size} room${affRooms.size > 1 ? 's' : ''}: ${[...affRooms.keys()].map(roomName).join(', ')}` : '']);
      if (readings.length) keys.push(['Moisture readings', String(readings.length), top ? `Highest ${fmtVal(top.x.value)}${top.room ? ' · ' + roomName(top.room) : ''}` : '']);
      if (rems.length) keys.push(['Removal', remL.toFixed(2) + ' lm', remA > 0 ? remA.toFixed(2) + ' m² of lining' : 'lineal only']);
    }
    sec.insertAdjacentHTML('afterbegin',
      `<div class="rp-cbrand"><div>${wordmark(30)}${brand.tagline ? `<div class="rp-tagline">${esc(brand.tagline)}</div>` : ''}</div>${brand.contact ? `<div class="rp-ccontact">${esc(brand.contact)}</div>` : ''}</div>` +
      `<div class="rp-ctop"><div class="rp-bar"></div><div class="rp-ctitle">${esc(rep.title)}</div><div class="rp-caddr">${esc(addr)}</div>` +
      (meta.length ? `<div class="rp-cmeta">${meta.map(([k, v]) => `<div><b>${esc(k)}</b>${esc(v)}</div>`).join('')}</div>` : '') + `</div>` +
      `<div class="rp-hero"></div>` +
      (keys.length ? `<div class="rp-keys">${keys.map(([k, v, s2]) => `<div class="rp-k"><b>${esc(k)}</b><div class="v${v.length > 14 ? ' long' : ''}">${esc(v)}</div>${s2 ? `<div class="s">${esc(s2)}</div>` : ''}</div>`).join('')}</div>` : ''));
    // hero: the plan with the affected area tinted, fitted between the title block and the key facts
    const topY = sec.querySelector('.rp-ctop').getBoundingClientRect().bottom - sec.getBoundingClientRect().top + 22;
    const keysEl = sec.querySelector('.rp-keys');
    const botY = (keysEl ? keysEl.getBoundingClientRect().top - sec.getBoundingClientRect().top : RP_H - 70) - 22;
    const hero = sec.querySelector('.rp-hero');
    hero.classList.add('rp-heroslot');
    if (iso3d) {
      // the cutaway, for orientation, when there is something on the walls
      const r = renderCut(doc, geo, { W: RP_CW, H: botY - topY, uid: 'cover', numbers: false, dims: false });
      hero.innerHTML = `<svg class="rp-iso" width="${RP_CW}" height="${f1(r.H)}" viewBox="0 0 ${r.W} ${f1(r.H)}" font-family="${FONT}">${r.body}</svg>`;
      hero.setAttribute('data-top', f1(topY)); hero.style.top = f1(topY) + 'px';
    } else {
    const heroLayers = { dims: false, furniture: false, affected: true, readings: false, removals: false, sources: false, wetzones: false };
    const hp0 = renderPlan(doc, geo, { markup: true, bare: true, noTags: true, layers: heroLayers });
    const k0 = Math.min(RP_CW / hp0.drawn.w, (botY - topY) / hp0.drawn.h, 1.15);
    const hp = renderPlan(doc, geo, { markup: true, bare: true, noTags: true, layers: heroLayers, lk: clamp(8 / (15 * k0), 0.8, 2.4) });
    const d = hp.drawn, kk = Math.min(RP_CW / d.w, (botY - topY) / d.h, 1.15);
    hero.innerHTML = `<svg width="${f1(d.w * kk)}" height="${f1(d.h * kk)}" viewBox="${d.x} ${f1(d.y)} ${d.w} ${f1(d.h)}" font-family="${FONT}">${hp.body}</svg>`;
    hero.setAttribute('data-top', f1(topY));

    }
  }

  /* 2. summary: what was found, strictly from the document, then the user's own text */
  const completion = dm && rtype === 'final' ? completionStatement(dm) : '';
  if (dm) {
    const li = [], c = dm.counts, prevV = visitsOf(baseDoc)[visitIdx(baseDoc, vid) - 1];
    const refList = ps => ps.length ? ps.map(p => p.ref).join(', ') : 'none';
    if (completion) li.push(`<b>Completion:</b> ${esc(completion)}`);

    if (prevV) {
      const by = t => dm.main.filter(p => p.trend === t);
      li.push(`<b>Since visit ${prevV.n}${visitDayLabel(prevV) ? ' (' + esc(visitDayLabel(prevV)) + ')' : ''}:</b> lower by more than 1 point: ${refList(by('down'))}; within 1 point: ${refList(by('level'))}; higher by more than 1 point: ${refList(by('up'))}.`);
    }
    li.push(`<b>At or below the drying goal (${esc(dm.goal.label)}):</b> ${c.atGoal} of ${c.measured} — points ${refList(dm.main.filter(p => p.atGoal))}.`);
    const hi = dm.main.filter(p => p.measured).sort((a, b) => b.value - a.value)[0];
    if (hi) li.push(`<b>Highest this visit:</b> point ${esc(hi.ref)}, ${fmtVal(hi.value)} (${esc(hi.where)}).`);

    for (const e of model.elevs.filter(e => e.marks.length)) {
      const byV = new Map(); for (const r of e.marks) { const k = itemVisit(r); byV.set(k, Math.max(byV.get(k) ?? 0, r.height)); }
      const mine = byV.get(vid), firstK = [...byV.keys()].sort((a, b) => visitIdx(baseDoc, a) - visitIdx(baseDoc, b))[0];

        (firstK && firstK !== vid ? `; ${mmLabel(byV.get(firstK))} on ${esc(visitDayLabel(visitById(baseDoc, firstK)) || 'visit ' + visitById(baseDoc, firstK).n)}` : '') + '.');
    }

    if (eqOn.length) li.push(`<b>Equipment on site:</b> ${esc(equipCounts(eqOn))}.`);
    const eqOff = equipOf(baseDoc.markup).filter(x => x.removed === vid);
    if (eqOff.length) li.push(`<b>Equipment removed on this visit:</b> ${esc(equipCounts(eqOff))}.`);
    const done = m.removals.filter(x => x._done && geo.wallById.has(x.wallId));
    if (done.length) li.push(`<b>Removal completed:</b> ` + done.map(x => { const w = geo.wallById.get(x.wallId), Lr = removalLen(x, w), a = Lr * removalHeightM(x, w), dv = visitById(baseDoc, x.doneVisit || itemVisit(x)); return `${ITEMS[ITEMS[x.item] ? x.item : 'other'].label} ${Lr.toFixed(2)} lm${a > 0 ? ' / ' + a.toFixed(2) + ' m²' : ''} (visit ${dv.n})`; }).join('; ') + '.');
    const blocks = [`<p class="rp-lede">The same points re-measured on each visit. Every figure below is taken from the readings and markup in this report; change is between this visit and the previous one.</p>`, `<h2>What was found</h2>`,
      ...li.map(x => `<ul class="rp-facts"><li>${x}</li></ul>`)];
    if (rep.summary.trim()) blocks.push('<h2>Summary</h2>', ...rep.summary.trim().split(/\n\s*\n/).map(p => `<p class="rp-free">${esc(p)}</p>`));
    if (rep.recommendations.trim()) blocks.push('<h2>Recommendations</h2>', ...rep.recommendations.trim().split(/\n\s*\n/).map(p => `<p class="rp-free">${esc(p)}</p>`));
    flow('summary', rtype === 'final' ? 'Summary and completion' : 'Summary of progress', blocks, 'p-summary');
  } else {
    const li = [];
    for (const s0 of sources) {
      const x = s0.x, bits = [s0.room ? roomName(s0.room) : null, s0.elev ? `on wall ${s0.elev.letter}` : s0.w ? 'on a wall' : null, s0.w && isNum(x.height) ? `at ${mmLabel(x.height)} above floor` : null].filter(Boolean);
      li.push(`<b>Water source ${s0.ref}:</b> ${esc(x.label || 'not labelled')}${bits.length ? ' — ' + esc(bits.join(', ')) : ''}${x.source === 'ar' ? ' (logged during the scan)' : ''}.`);

      const hs = e.marks.map(r => r.height);

    if (rep.recommendations.trim()) blocks.push('<h2>Recommendations</h2>', ...rep.recommendations.trim().split(/\n\s*\n/).map(p => `<p class="rp-free">${esc(p)}</p>`));
